<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ARQUIVO ENTREGUE PELO PROFESSOR — Peça 6 do projeto Mural (Programação de
  Aplicativos). NÃO altere este HTML nem o style.css: a atividade
  (turmas/sistemas/atividades/projeto-mural-app-trabalho.html) pede pra
  escrever só JavaScript, usando exatamente os ids abaixo. Se precisar de um
  id/class diferente, ajuste o SEU app.js — nunca este arquivo.

  Contrato de ids que o app.js (peça 5) e o mural.js (peça 6) esperam:
    #telaAuth, #formCadastro (#cadNome #cadTurma #cadUsuario #cadSenha),
    #formLogin (#loginUsuario #loginSenha)
    #telaApp, #perfilFoto #perfilNome #perfilTurma
    #formPost (#postTexto), #feedContainer
    Cada post renderizado deve ter a classe .post-card e, dentro dela,
    um botão .btn-curtir com data-post-id e um <span class="contador-curtidas">.
-->

<header class="topbar">
  <h1>📣 Mural</h1>
  <button id="btnSair" class="btn btn-secondary" hidden>Sair</button>
</header>

<main>
  <section id="telaAuth">
    <div class="auth-cards">
      <form id="formCadastro" class="card">
        <h2>Criar conta</h2>
        <label>Nome<input id="cadNome" type="text" required></label>
        <label>Turma<input id="cadTurma" type="text" required></label>
        <label>Usuário<input id="cadUsuario" type="text" required></label>
        <label>Senha<input id="cadSenha" type="password" required></label>
        <button type="submit" class="btn">Cadastrar</button>
        <p class="form-msg" id="cadMsg"></p>
      </form>

      <form id="formLogin" class="card">
        <h2>Entrar</h2>
        <label>Usuário<input id="loginUsuario" type="text" required></label>
        <label>Senha<input id="loginSenha" type="password" required></label>
        <button type="submit" class="btn">Entrar</button>
        <p class="form-msg" id="loginMsg"></p>
      </form>
    </div>
  </section>

  <section id="telaApp" hidden>
    <div id="perfilArea" class="card">
      <img id="perfilFoto" src="https://placehold.co/64x64" alt="Foto do perfil">
      <div>
        <div id="perfilNome"></div>
        <div id="perfilTurma"></div>
      </div>
    </div>

    <form id="formPost" class="card">
      <textarea id="postTexto" placeholder="O que você quer compartilhar?" required></textarea>
      <button type="submit" class="btn">Publicar</button>
    </form>

    <div id="feedContainer"></div>
  </section>
</main>

<!-- 1º: o app.js da peça anterior (Desenvolvimento de Sistemas 1) — as 5 funções de backend. -->
<script src="app.js"></script>
<!-- 2º: o SEU JavaScript desta peça, ligando o HTML acima às funções acima. -->
<script src="mural.js"></script>
</body>
</html>
