<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinancApp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ARQUIVO ENTREGUE PELO PROFESSOR — Peça 6 do projeto FinancApp (Programação
  de Aplicativos). NÃO altere este HTML nem o style.css: a atividade
  (turmas/sistemas/atividades/projeto-financapp-app-trabalho.html) pede pra
  escrever só JavaScript, usando exatamente os ids abaixo. Se precisar de um
  id/class diferente, ajuste o SEU financapp.js — nunca este arquivo.

  Contrato de ids que o app.js (peça 5) e o financapp.js (peça 6) esperam:
    #telaAuth, #formCadastro (#cadNome #cadTurma #cadUsuario #cadSenha),
    #formLogin (#loginUsuario #loginSenha)
    #telaApp, #perfilFoto #perfilNome #perfilTurma
    #saldoValor (mostra o saldo total: receitas - despesas)
    #formLancamento (#lancDescricao #lancValor #lancTipo #lancTags)
    #extratoContainer (onde cada lançamento entra na tela)
    Cada lançamento renderizado deve ter a classe .lancamento-card, com um
    <span class="lancamento-valor"> (positivo/verde pra receita, negativo/
    vermelho pra despesa) e, dentro dela, um <div class="lancamento-tags">
    com um <span class="tag-badge"> por tag.
-->

<header class="topbar">
  <h1>💰 FinancApp</h1>
  <button id="btnSair" class="btn btn-secondary" hidden>Sair</button>
</header>

<main>
  <section id="telaAuth">
    <div class="auth-cards">
      <form id="formCadastro" class="card">
        <h2>Criar conta</h2>
        <label>Nome<input id="cadNome" type="text" required></label>
        <label>Turma<input id="cadTurma" type="text" required></label>
        <label>Usuário<input id="cadUsuario" type="text" required></label>
        <label>Senha<input id="cadSenha" type="password" required></label>
        <button type="submit" class="btn">Cadastrar</button>
        <p class="form-msg" id="cadMsg"></p>
      </form>

      <form id="formLogin" class="card">
        <h2>Entrar</h2>
        <label>Usuário<input id="loginUsuario" type="text" required></label>
        <label>Senha<input id="loginSenha" type="password" required></label>
        <button type="submit" class="btn">Entrar</button>
        <p class="form-msg" id="loginMsg"></p>
      </form>
    </div>
  </section>

  <section id="telaApp" hidden>
    <div id="perfilArea" class="card">
      <img id="perfilFoto" src="https://placehold.co/64x64" alt="Foto do perfil">
      <div>
        <div id="perfilNome"></div>
        <div id="perfilTurma"></div>
      </div>
    </div>

    <div id="saldoArea" class="card">
      <span class="saldo-label">Saldo atual</span>
      <span id="saldoValor" class="saldo-valor">R$ 0,00</span>
    </div>

    <form id="formLancamento" class="card">
      <h2>Novo lançamento</h2>
      <label>Descrição<input id="lancDescricao" type="text" required></label>
      <label>Valor (R$)<input id="lancValor" type="number" step="0.01" min="0.01" required></label>
      <label>Tipo
        <select id="lancTipo" required>
          <option value="receita">Receita (entrada)</option>
          <option value="despesa">Despesa (saída)</option>
        </select>
      </label>
      <label>Tags (separadas por vírgula)<input id="lancTags" type="text" placeholder="ex.: mercado, transporte"></label>
      <button type="submit" class="btn">Registrar</button>
    </form>

    <div id="extratoContainer"></div>
  </section>
</main>

<!--
  Adicione aqui embaixo 2 tags de script, NESTA ORDEM, apontando pros 2
  arquivos que já existem no SEU repositório financapp-seuusuario (não
  existem neste template — cada um é criado numa peça diferente do
  projeto):
    1º) o script do app.js, da peça anterior (Desenvolvimento de Sistemas 1) — as 5 funções de backend.
    2º) o script do financapp.js, desta peça, ligando o HTML acima a essas funções.
-->
</body>
</html>
