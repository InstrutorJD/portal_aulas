<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Serviços de Internet e Modelos OSI/TCP-IP: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono', monospace; height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(58,160,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:'VT323', monospace; font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:8px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--yellow); white-space:pre;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:'VT323', monospace; font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(58,160,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:'VT323', monospace; font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(58,160,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'redes_servicos_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>REDES — CENTRAL DE REDES (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">12</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `redes_servicos_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Oi de novo! A internet não é uma coisa só — é um conjunto de <b>serviços especializados</b>, cada um com seu propósito e sua "porta" de entrada padrão. Vamos conhecer os principais, começando pelo <b>DHCP</b>: o serviço que atribui um endereço IP <i>automaticamente</i> pra cada dispositivo que entra na rede — sem precisar configurar IP estático na mão.',
      question: {
        prompt: 'Qual serviço atribui automaticamente um endereço IP a um dispositivo que entra na rede?',
        options: ['DHCP', 'DNS', 'FTP', 'RDP'],
        correctIndex: 0,
        explanation: 'Isso! DHCP (Dynamic Host Configuration Protocol) entrega um IP automaticamente, evitando configuração manual em cada dispositivo.'
      }
    },
    {
      story: 'Pra navegar em sites, usamos o protocolo <b>HTTP</b> (porta padrão <code>80</code>) ou sua versão segura, <b>HTTPS</b> (porta padrão <code>443</code>), que criptografa a comunicação entre o navegador e o site.',
      question: {
        prompt: 'Qual porta padrão o protocolo HTTPS (a versão segura da Web) usa?',
        options: ['443', '80', '21', '22'],
        correctIndex: 0,
        explanation: 'Correto! HTTPS usa a porta 443 — o "S" no nome já indica a camada extra de segurança (criptografia) em cima do HTTP.'
      }
    },
    {
      story: 'Pra ENVIAR um e-mail, o protocolo usado é o <b>SMTP</b> (porta <code>25</code>). Já pra RECEBER e-mails, existem dois protocolos: <b>POP3</b> (porta <code>110</code>, baixa e geralmente remove do servidor) e <b>IMAP</b> (porta <code>143</code>, mantém sincronizado com o servidor).',
      question: {
        prompt: 'Qual protocolo é usado para ENVIAR e-mails?',
        options: ['SMTP', 'POP3', 'IMAP', 'FTP'],
        correctIndex: 0,
        explanation: 'Isso! SMTP (Simple Mail Transfer Protocol) cuida do envio — POP3 e IMAP cuidam do recebimento, de formas diferentes.'
      }
    },
    {
      story: 'Pra transferir arquivos entre computadores usando um cliente específico, existe o <b>FTP</b> (File Transfer Protocol), que roda na porta <code>21</code> — muito usado, por exemplo, pra publicar arquivos num servidor web.',
      question: {
        prompt: 'Qual protocolo é usado para transferência de arquivos via cliente específico?',
        options: ['FTP', 'HTTP', 'DHCP', 'RDP'],
        correctIndex: 0,
        explanation: 'Correto! FTP é o protocolo clássico de transferência de arquivos, rodando por padrão na porta 21.'
      }
    },
    {
      story: 'Pra acessar OUTRO computador remotamente, existem dois protocolos comuns: <b>SSH</b> (porta <code>22</code>, acesso remoto via linha de comando, com segurança) e <b>RDP</b> (porta <code>3389</code>, acesso remoto com a interface gráfica completa, comum no Windows).',
      question: {
        prompt: 'Qual protocolo permite acesso remoto seguro via LINHA DE COMANDO a outro computador?',
        options: ['SSH', 'FTP', 'DHCP', 'HTTP'],
        correctIndex: 0,
        explanation: 'Isso! SSH (Secure Shell) é o protocolo padrão pra acesso remoto via terminal, com toda a comunicação criptografada.'
      }
    },
    {
      story: 'Serviços de <b>comunicação em tempo real</b> (chamadas de vídeo, chat instantâneo) têm uma característica em comum, diferente de e-mail ou FTP: eles precisam de <b>baixa latência</b> — o atraso entre enviar e receber precisa ser mínimo, senão a conversa trava.',
      question: {
        prompt: 'Qual característica é ESSENCIAL para serviços de comunicação em tempo real (chamadas de vídeo, chat)?',
        options: ['Baixa latência (atraso mínimo)', 'Alta capacidade de armazenamento', 'Uso exclusivo de cabo', 'Criptografia de arquivo'],
        correctIndex: 0,
        explanation: 'Correto! Sem baixa latência, uma chamada de vídeo trava e atrasa — é a característica mais crítica desse tipo de serviço.'
      }
    },
    {
      story: 'Cada um desses serviços (HTTP, FTP, SSH...) tem sua <b>porta lógica</b> padrão — pense na porta como um "número de apartamento" dentro do mesmo "prédio" (o endereço IP do host), que direciona o tráfego pro serviço certo.',
      question: {
        prompt: 'O que é uma "porta lógica" num host de rede?',
        options: [
          'Um número que identifica qual serviço específico deve receber aquele tráfego',
          'Um cabo físico conectado ao roteador',
          'Um tipo de endereço IP',
          'Uma máscara de sub-rede'
        ],
        correctIndex: 0,
        explanation: 'Isso! A porta é como um "endereço interno" dentro do host, direcionando o tráfego de rede pro serviço certo (Web, e-mail, FTP...).'
      }
    },
    {
      story: 'Agora vamos ver COMO tudo isso se organiza: o <b>modelo OSI</b> divide a comunicação de rede em <b>7 camadas</b> — da mais física (cabos, sinais elétricos) até a mais abstrata (os próprios aplicativos que usamos, como navegador e e-mail).',
      question: {
        prompt: 'Quantas camadas tem o modelo OSI?',
        options: ['7', '4', '5', '10'],
        correctIndex: 0,
        explanation: 'Correto! O modelo OSI (Open Systems Interconnection) organiza a comunicação em 7 camadas, cada uma com uma responsabilidade específica.'
      }
    },
    {
      story: 'Na prática, a internet de verdade funciona baseada num modelo mais enxuto, o <b>TCP/IP</b>, com apenas <b>4 camadas</b> — que agrupam as 7 do OSI em blocos maiores, mas cobrindo as mesmas ideias gerais (do físico ao aplicativo).',
      question: {
        prompt: 'Quantas camadas tem o modelo TCP/IP (o modelo que a internet realmente usa)?',
        options: ['4', '7', '2', '9'],
        correctIndex: 0,
        explanation: 'Isso! O modelo TCP/IP condensa a ideia do OSI em 4 camadas — mais simples, e é o que efetivamente roda na internet.'
      }
    },
    {
      story: 'Serviços como <b>HTTP, FTP, SMTP e SSH</b> — os que você acabou de aprender — ficam todos na camada mais "de cima" desses modelos: a camada de <b>APLICAÇÃO</b>. É onde o software que o usuário usa diretamente conversa com a rede.',
      question: {
        prompt: 'Em qual camada do modelo OSI/TCP-IP os protocolos como HTTP, FTP e SSH operam?',
        options: ['Aplicação', 'Física', 'Rede', 'Enlace'],
        correctIndex: 0,
        explanation: 'Correto! A camada de Aplicação é onde vivem os protocolos que os programas do dia a dia usam diretamente pra se comunicar.'
      }
    },
    {
      story: 'Lembra do diagnóstico "físico primeiro, depois lógico" que você aprendeu antes? Ele é basicamente andar pelas <b>camadas de baixo pra cima</b>: primeiro a camada física (cabo, sinal), depois as camadas mais altas — até chegar na aplicação. Pensar em camadas ajuda MUITO a isolar onde um problema está.',
      question: {
        prompt: 'Por que pensar em "camadas" (física → ... → aplicação) ajuda no diagnóstico de problemas de rede?',
        options: [
          'Porque ajuda a isolar em qual "nível" o problema está, testando de baixo pra cima',
          'Porque cada camada usa um cabo diferente',
          'Porque só a camada física pode dar problema',
          'Não ajuda em nada, é só teoria'
        ],
        correctIndex: 0,
        explanation: 'Isso! O raciocínio em camadas é exatamente o que fundamenta o método de diagnóstico: isolar problemas indo do mais básico (físico) ao mais específico (aplicação).'
      }
    },
    {
      story: 'Com isso, você já sabe reconhecer os principais serviços da internet (DHCP, Web, e-mail, FTP, acesso remoto), suas portas padrão, e como os modelos OSI e TCP/IP organizam tudo isso em camadas — da mais física até a aplicação que o usuário realmente usa.',
      question: {
        prompt: 'Qual protocolo cuida do RECEBIMENTO de e-mails mantendo tudo sincronizado com o servidor (em vez de baixar e remover)?',
        options: ['IMAP', 'SMTP', 'FTP', 'RDP'],
        correctIndex: 0,
        explanation: 'Correto! IMAP mantém a caixa de entrada sincronizada com o servidor — diferente do POP3, que tradicionalmente baixa e remove as mensagens.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Redes — Serviços de Internet e Modelos OSI/TCP-IP',
      subtitle: 'Aula Teórica · Trilha Serviços de Internet e Modelos · Turma Sistemas',
      capacidade: 'Reconhecer tipos e características (classificação, estrutura e modelos).',
      steps: STEPS,
      fileName: 'redes-servicos-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Redes: Serviços" no Portal de Aulas para os alunos resolverem chamados de verdade.'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const saved = loadProgress();
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('redes_servicos_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[currentStepIndex];
    reportStep(`Redes — Serviços e Modelos — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'eri-row';
    row.innerHTML = `
      <div class="eri-avatar">🌐</div>
      <div class="speech-bubble">
        <span class="eri-name">Nex, Técnico da Central de Redes</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[currentStepIndex];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    q.options.forEach((optText, idx) => {
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(idx);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === q.correctIndex;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[q.correctIndex].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = `${isCorrect ? '✅ Correto!' : '❌ Não foi dessa vez.'} ${q.explanation}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Redes — Serviços e Modelos — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney() {
    saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: true });
    reportStep(`Redes — Serviços e Modelos — Concluída (${correctCount}/${STEPS.length})`);

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Serviços de Internet e Modelos concluídos!</h2>
        <p>Você já conhece DHCP, HTTP/HTTPS, SMTP/POP3/IMAP, FTP, SSH/RDP, portas padrão e as camadas dos modelos OSI e TCP/IP.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas.</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Redes.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney();
  } else {
    renderStory();
  }
</script>

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
