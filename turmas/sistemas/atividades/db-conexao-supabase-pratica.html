Nesta atividade, você vai desenvolver um pequeno sistema web para **cadastro de clientes** — passo a passo, do zero até a segurança do banco de dados.

Você vai começar criando uma página com **HTML, CSS e JavaScript**. Depois vai criar um banco de dados no **Supabase**. Por fim, vai conectar o seu sistema ao banco pra que os dados digitados no formulário sejam armazenados e consultados de verdade.

### Situação-problema

Uma pequena empresa precisa de um sistema pra cadastrar seus clientes. Atualmente, os funcionários anotam os dados manualmente, dificultando a organização das informações. Você foi escolhido pra desenvolver uma primeira versão do sistema.

O sistema deverá permitir:
- cadastrar clientes;
- armazenar os dados no banco;
- consultar os clientes cadastrados;
- apresentar os clientes na página.

Cada cliente terá: Nome, E-mail e Telefone.

### Tecnologias utilizadas

- HTML
- CSS
- JavaScript
- GitHub
- GitHub Codespaces
- Supabase
- PostgreSQL

Pra facilitar o aprendizado, não será utilizado nenhum framework como React ou Vue.

### Objetivos da atividade

Ao final, você deverá conseguir criar um projeto no GitHub, utilizar o GitHub Codespaces, criar uma página HTML com formulário, usar JavaScript pra capturar dados, criar um projeto no Supabase, criar uma tabela, conectar JavaScript ao Supabase, inserir e consultar dados, apresentar os dados na página, compreender a Data API, o conceito de RLS, criar uma política de acesso, e entender por que a segurança do banco de dados importa.

§§§text

### ETAPA 36 — Entender permissões

O Supabase trabalha com roles, incluindo ¤anon¤ e ¤authenticated¤.

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Markdown bem enxuto, só o suficiente pro conteúdo desta atividade:
  // cabeçalhos (#..######), blocos de código (§§§lang ... §§§ — não uso
  // crase aqui de propósito, pra não colidir com os template strings do
  // corpo logo acima), tabela (|col|col|), lista numerada/com marcador,
  // checklist (- [ ] item) e citação (> texto). Qualquer coisa fora disso
  // vira parágrafo simples.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

      ${renderNav(true, false)}
    `;
    document.getElementById('btnBack').addEventListener('click', () => { currentIndex = STEPS.length - 1; renderStep(); });

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const u = document.getElementById('vistoUser').value;
      const p = document.getElementById('vistoSenha').value;
      vistoMsg.style.display = 'none';
      if (!u || !p) {
        vistoMsg.className = 'visto-msg erro';
        vistoMsg.textContent = 'Informe usuário e senha do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificar(u, p)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'visto-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'visto-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  renderStep();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
