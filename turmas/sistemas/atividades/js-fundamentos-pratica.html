<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desenvolvimento de Sistemas — JavaScript: Fundamentos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:190px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--green); color:var(--green); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex:1 1 0%; min-height:90px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }
  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--green); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:14px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--yellow); }

  .explanation-box{
    background:#081208; border:1px solid var(--green-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--green); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--yellow); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--yellow); white-space:pre;
  }

  .given-vars{ font-size:10.5px; color:var(--ink-dim); margin-top:8px; }
  .given-vars b{ color:var(--yellow); }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--yellow); border:1px solid var(--green-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(212,200,106,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--yellow);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--yellow); }

  textarea#codeInput{
    width:100%; flex:0 0 230px; min-height:140px; resize:vertical; background:#000; color:var(--green);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5;
  }
  textarea#codeInput:focus{ border-color:var(--green); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .console{
    background:#060806; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:0 0 100px; min-height:70px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--green); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--green); font-weight:bold; }
  .console .line.warn{ color:var(--yellow); }

  /* Celular/telas estreitas: a barra lateral + painel lado a lado espreme
     demais o conteúdo (texto quebrando palavra a palavra). Empilha tudo
     numa coluna só e deixa a página inteira rolar, em vez de depender de
     várias regiões de scroll aninhadas. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:200px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'js_fundamentos_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JAVASCRIPT — DESAFIOS DE FUNDAMENTOS</div>
    <div>CONCLUÍDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Desafios</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>
          <div class="given-vars" id="givenVarsLabel" style="display:none;"></div>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo desafio →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `js_fundamentos_pratica_progress_${username}`;

  // Cada desafio testa o código do aluno de um jeito diferente, conforme
  // `check.type`:
  //   'variable' — o código deve criar uma variável com o nome de
  //                check.name; cada teste informa `values` (atribuídas às
  //                givenVars) e o `expected` daquela variável.
  //   'console'  — o código deve chamar console.log(...); cada teste
  //                informa `values` (givenVars) e o `expected` é o
  //                primeiro valor logado.
  //   'function' — o código deve declarar uma função chamada check.name;
  //                cada teste informa `args` (passados na chamada) e o
  //                `expected` é o retorno dela.
  const CHALLENGES = [
    {
      id: 1,
      title: 'Guardando um valor',
      resultVar: 'resultado',
      givenVars: [],
      starter: '// crie uma variável chamada resultado com o valor 100\n\n',
      explanation: 'Uma <b>variável</b> é como uma caixinha com um nome, onde você guarda um valor para usar depois. Para criar uma, use a palavra <code>let</code>, dê um nome, um sinal de igual <code>=</code> e o valor, terminando com <code>;</code>.<pre>let idade = 10;</pre>',
      desc: 'Crie uma variável chamada <code>resultado</code> guardando o valor <b>100</b>.',
      hint: 'Use <code>let</code>, o nome exato pedido pra variável e o valor certo, seguido de ponto e vírgula.',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: {}, expected: 100 }
      ]
    },
    {
      id: 2,
      title: 'Somando valores',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado com a soma de a e b\n\n',
      explanation: 'Para somar dois números, use o sinal <code>+</code>.<pre>let total = x + y;</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável chamada <code>resultado</code> com a soma delas.',
      hint: 'Qual operador matemático soma dois valores? Aplique ele entre <code>a</code> e <code>b</code>.',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 2, b: 3 }, expected: 5 },
        { values: { a: 10, b: 15 }, expected: 25 },
        { values: { a: 0, b: 0 }, expected: 0 }
      ]
    },
    {
      id: 3,
      title: 'Dividindo valores',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado com a divisão de a por b\n\n',
      explanation: 'Para dividir, use o sinal <code>/</code>.<pre>let metade = x / 2;</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável chamada <code>resultado</code> com o valor de <code>a</code> dividido por <code>b</code>.',
      hint: 'Qual sinal representa divisão em JavaScript? Repare na ordem: é <code>a</code> dividido por <code>b</code>.',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 10, b: 2 }, expected: 5 },
        { values: { a: 9, b: 3 }, expected: 3 },
        { values: { a: 7, b: 2 }, expected: 3.5 }
      ]
    },
    {
      id: 4,
      title: 'Mostrando na tela',
      resultVar: null,
      givenVars: ['idade'],
      starter: '// a variável idade já existe\n// use console.log para mostrar o valor de idade\n\n',
      explanation: 'O comando <code>console.log(...)</code> mostra qualquer valor na tela (no console do navegador) — é a forma mais comum de exibir um resultado.<pre>console.log(idade);</pre>',
      desc: 'A variável <code>idade</code> já existe. Use <code>console.log</code> para mostrar o valor dela.',
      hint: '<code>console.log(valor)</code> mostra o que estiver dentro dos parênteses — passe a variável <code>idade</code> pra ele.',
      check: { type: 'console' },
      tests: [
        { values: { idade: 10 }, expected: 10 },
        { values: { idade: 25 }, expected: 25 },
        { values: { idade: 0 }, expected: 0 }
      ]
    },
    {
      id: 5,
      title: 'Criando uma função',
      resultVar: null,
      givenVars: [],
      starter: '// crie uma função chamada saudacao, sem parâmetros, que retorna o texto \'Olá!\'\nfunction saudacao() {\n\n}\n',
      explanation: 'Uma <b>função</b> é um bloco de código com nome, que você pode chamar (executar) sempre que precisar. Para criar uma, use a palavra <code>function</code>, o nome, parênteses <code>()</code> e chaves <code>{ }</code> envolvendo o que ela faz.<pre>function saudacao() {\n  return "Olá!";\n}</pre>',
      desc: 'Crie uma função chamada <code>saudacao</code>, sem parâmetros, que retorna o texto <code>"Olá!"</code> quando chamada.',
      hint: 'A palavra <code>function</code>, o nome <code>saudacao</code>, parênteses vazios <code>()</code> e chaves <code>{ }</code> por volta do corpo. Dentro, use <code>return</code> seguido do texto exato pedido.',
      check: { type: 'function', name: 'saudacao' },
      tests: [
        { args: [], expected: 'Olá!' }
      ]
    },
    {
      id: 6,
      title: 'Retornando um valor',
      resultVar: null,
      givenVars: [],
      starter: '// crie uma função chamada dobro que recebe um parâmetro n e retorna o dobro dele\nfunction dobro(n) {\n\n}\n',
      explanation: 'Dentro de uma função, <code>return</code> devolve um valor pra quem chamou ela — é assim que uma função "responde" alguma coisa, em vez de só executar código por dentro.<pre>function dobro(n) {\n  return n * 2;\n}</pre>Quem chamar <code>dobro(5)</code> recebe <code>10</code> de volta.',
      desc: 'Crie uma função chamada <code>dobro</code> que recebe um parâmetro <code>n</code> e retorna o dobro desse valor (<code>n</code> vezes 2).',
      hint: 'O parâmetro <code>n</code> já está disponível dentro da função — multiplique ele por <code>2</code> e use <code>return</code> pra devolver o resultado.',
      check: { type: 'function', name: 'dobro' },
      tests: [
        { args: [5], expected: 10 },
        { args: [0], expected: 0 },
        { args: [-3], expected: -6 }
      ]
    },
    {
      id: 7,
      title: 'Tomando decisões',
      resultVar: 'resultado',
      givenVars: ['idade'],
      starter: '// a variável idade já existe\n// crie uma variável chamada resultado usando if/else\n\n',
      explanation: 'Um bloco <code>if/else</code> escolhe entre dois caminhos, dependendo de uma condição.<pre>if (idade &gt;= 18) {\n  resultado = "maior de idade";\n} else {\n  resultado = "menor de idade";\n}</pre>',
      desc: 'A variável <code>idade</code> já existe. Crie uma variável chamada <code>resultado</code> com o texto <code>"maior de idade"</code> se <code>idade</code> for maior ou igual a 18, ou <code>"menor de idade"</code> caso contrário.',
      hint: '<code>if (condição) { ... } else { ... }</code> — a condição usa um operador de "maior ou igual" entre <code>idade</code> e <code>18</code>.',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { idade: 18 }, expected: 'maior de idade' },
        { values: { idade: 17 }, expected: 'menor de idade' },
        { values: { idade: 0 }, expected: 'menor de idade' }
      ]
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // e baixar um .txt com enunciado + critério de avaliação (testes) de cada
  // desafio — aqui não existe UM código certo, e sim um valor esperado por
  // combinação de entradas, então o gabarito lista os casos de teste.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'JavaScript — Fundamentos',
      subtitle: 'Prática · Desenvolvimento de Sistemas 1 · Turma Sistemas',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          if (c.check.type === 'function') {
            const argsStr = t.args.map(a => JSON.stringify(a)).join(', ');
            return `${c.check.name}(${argsStr}) deve retornar ${JSON.stringify(t.expected)}`;
          }
          const inputs = Object.entries(t.values || {}).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join(', ');
          const prefix = inputs ? `Com ${inputs}` : 'Sem variáveis de entrada';
          if (c.check.type === 'console') {
            return `${prefix} → console.log deve mostrar ${JSON.stringify(t.expected)}`;
          }
          return `${prefix} → ${c.check.name} deve ser ${JSON.stringify(t.expected)}`;
        }).join('\n')
      })),
      fileName: 'js-fundamentos-pratica-gabarito.txt'
    });
  };

  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const explanationTextEl = document.getElementById('explanationText');
  const givenVarsLabelEl = document.getElementById('givenVarsLabel');
  const codeInput = document.getElementById('codeInput');
  const btnRun = document.getElementById('btnRun');
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }

  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  function isUnlocked(challenge) {
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '✅' : (unlocked ? '▶️' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.id}. ${c.title}</span>`;
      if (unlocked) {
        item.addEventListener('click', () => selectChallenge(c.id));
      }
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Desafio ${challenge.id}: ${challenge.title}`;
    explanationTextEl.innerHTML = challenge.explanation;
    challengeDescEl.innerHTML = challenge.desc;
    codeInput.value = challenge.starter;
    btnNext.style.display = 'none';

    if (challenge.givenVars.length > 0) {
      givenVarsLabelEl.innerHTML = `Variáveis disponíveis: <b>${challenge.givenVars.join(', ')}</b>`;
      givenVarsLabelEl.style.display = 'block';
    } else {
      givenVarsLabelEl.style.display = 'none';
    }

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    clearConsole();
    if (completed.has(id)) {
      logConsole('Você já concluiu este desafio. Pode refazer pra treinar.', 'info');
    }
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'js_fundamentos_pratica',
        `JavaScript — Fundamentos — Desafio ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  function clearConsole() {
    consoleOutput.innerHTML = '';
  }

  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.textContent = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  // Descreve as entradas de um teste, adaptado ao tipo de checagem — só
  // pra deixar as linhas do console legíveis (não afeta a correção).
  function describeInputs(challenge, t) {
    if (challenge.check.type === 'function') {
      return `${challenge.check.name}(${t.args.map(a => JSON.stringify(a)).join(', ')})`;
    }
    const entries = Object.entries(t.values || {});
    if (entries.length === 0) return 'sem variáveis de entrada';
    return entries.map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join(', ');
  }

  // Roda o código do aluno pro tipo de checagem do desafio e devolve
  // { result, errorMsg }. Nunca deixa uma exceção do código do aluno
  // escapar pra fora — vira errorMsg.
  function runOneTest(challenge, t) {
    try {
      if (challenge.check.type === 'console') {
        const logs = [];
        const fakeConsole = { log: (...args) => logs.push(args.length === 1 ? args[0] : args.join(' ')) };
        const paramNames = [...challenge.givenVars, 'console'];
        const paramValues = [...challenge.givenVars.map(name => t.values[name]), fakeConsole];
        const fn = new Function(...paramNames, codeInput.value);
        fn(...paramValues);
        if (logs.length === 0) return { errorMsg: 'console.log não foi chamado' };
        return { result: logs[0] };
      }

      if (challenge.check.type === 'function') {
        const fnFactory = new Function(
          `${codeInput.value}\nreturn typeof ${challenge.check.name} === 'function' ? ${challenge.check.name} : undefined;`
        );
        const fn = fnFactory();
        if (typeof fn !== 'function') return { errorMsg: `a função '${challenge.check.name}' não foi criada` };
        return { result: fn(...t.args) };
      }

      // 'variable'
      const fnFactory = new Function(
        ...challenge.givenVars,
        `${codeInput.value}\nreturn typeof ${challenge.check.name} !== 'undefined' ? ${challenge.check.name} : undefined;`
      );
      const paramValues = challenge.givenVars.map(name => t.values[name]);
      const result = fnFactory(...paramValues);
      if (result === undefined) return { errorMsg: `a variável '${challenge.check.name}' não foi criada` };
      return { result };
    } catch (err) {
      return { errorMsg: err.message };
    }
  }

  function runChallenge() {
    const challenge = CHALLENGES.find(c => c.id === selectedId);
    if (!challenge) return;
    clearConsole();

    let allPass = true;
    const resultLabel = challenge.check.type === 'console'
      ? 'console mostrou'
      : challenge.check.type === 'function'
        ? `${challenge.check.name}(...) retornou`
        : `${challenge.check.name} =`;

    challenge.tests.forEach((t, i) => {
      const { result, errorMsg } = runOneTest(challenge, t);
      const pass = !errorMsg && result === t.expected;
      if (!pass) allPass = false;

      const prefix = `[Teste ${i + 1}] ${describeInputs(challenge, t)} → `;

      if (pass) {
        logConsole(`${prefix}${resultLabel} ${JSON.stringify(result)} ✅`, 'pass');
      } else if (errorMsg) {
        logConsole(`${prefix}${errorMsg} ❌`, 'fail');
      } else {
        logConsole(`${prefix}${resultLabel} ${JSON.stringify(result)} (esperado ${JSON.stringify(t.expected)}) ❌`, 'fail');
      }
    });

    if (allPass) {
      completed.add(challenge.id);
      saveCompleted(completed);

      const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
      if (isLast) {
        logConsole('🏆 Você concluiu todos os desafios de JavaScript!', 'success');
      } else {
        logConsole('✅ Desafio concluído! Próximo desafio liberado.', 'success');
        btnNext.style.display = 'inline-block';
      }
      renderSidebar();

      if (typeof window.reportActivity === 'function') {
        window.reportActivity(
          'js_fundamentos_pratica',
          `JavaScript — Fundamentos — Desafio ${challenge.id}: ${challenge.title} (concluído)`,
          { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
        );
      }
    } else {
      logConsole('❌ Ainda não! Ajuste o código e tente de novo.', 'warn');
    }
  }

  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });

  btnRun.addEventListener('click', runChallenge);
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  selectChallenge(selectedId);
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
