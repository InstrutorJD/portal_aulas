<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Trabalho: Mural — Lógica de Backend com Supabase</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0d0912; --panel:#171022; --panel2:#130d1c; --line:#2e2340;
    --accent:#b98cff; --accent-dim:#7c56b3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#e7defa; --ink-dim:#8b7aa8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--accent-dim); background:#0a0710;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(185,140,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--accent); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .step-wrap{ width:100%; max-width:720px; display:flex; flex-direction:column; gap:14px; }

  .card{ background:var(--panel); border:1px solid var(--line); padding:18px 20px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:22px; color:var(--yellow); margin:0 0 14px; letter-spacing:1px;
  }

  .md-body{ font-size:13.5px; line-height:1.7; }
  .md-body h3, .md-body h4, .md-body h5, .md-body h6{
    font-family:var(--user-font-display, 'VT323', monospace); color:var(--accent); letter-spacing:0.5px;
    margin:16px 0 6px; font-size:16px;
  }
  .md-body h3{ padding-top:10px; border-top:1px dashed var(--line); }
  .md-body h3:first-child{ padding-top:0; border-top:none; }
  .md-body p{ margin:0 0 10px; }
  .md-body code{ background:#000; color:var(--accent); padding:1px 5px; border-radius:2px; font-size:0.92em; }
  .md-body pre{
    background:#000; border:1px solid var(--line); padding:10px 12px; overflow-x:auto;
    margin:0 0 12px; border-radius:2px;
  }
  .md-body pre code{ background:none; padding:0; color:var(--ink); white-space:pre; }
  .md-body ul.md-list, .md-body ol.md-list{ margin:0 0 12px; padding-left:22px; }
  .md-body ul.md-list li, .md-body ol.md-list li{ margin-bottom:5px; }
  .md-body li.md-check{ list-style:none; margin-left:-22px; padding-left:0; }
  .md-body li.md-check::before{ content:'☐ '; color:var(--accent-dim); }
  .md-body blockquote{
    margin:0 0 12px; padding:8px 14px; border-left:3px solid var(--accent-dim); color:var(--yellow); font-style:italic;
  }
  .md-table-wrap{ overflow-x:auto; margin:0 0 12px; }
  table.md-table{ border-collapse:collapse; width:100%; font-size:13px; }
  table.md-table th, table.md-table td{ border:1px solid var(--line); padding:6px 10px; text-align:left; }
  table.md-table th{ background:var(--panel2); color:var(--yellow); }

  .step-nav{ display:flex; justify-content:space-between; align-items:center; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--accent); color:#150a24; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:wait; }
  button.btn-secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent-dim); }

  .visto-box p{ font-size:13.5px; line-height:1.7; margin:0 0 10px; }
  .visto-form{ display:flex; flex-direction:column; gap:12px; max-width:340px; margin-top:14px; }
  .visto-form label{ display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .visto-form input{
    font-family:inherit; font-size:14px; padding:9px 10px; background:#000; color:var(--ink);
    border:1px solid var(--line); border-radius:2px;
  }
  .visto-form input:focus{ outline:none; border-color:var(--accent-dim); }
  .visto-msg{ font-size:12.5px; padding:8px 10px; border:1px dashed var(--line); }
  .visto-msg.erro{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .visto-msg.ok{ border-color:var(--accent); color:var(--accent); }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .card{ padding:14px 16px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'projeto_mural_backend_trabalho';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>DESENVOLVIMENTO DE SISTEMAS 1 — TRABALHO: MURAL — LÓGICA DE BACKEND COM SUPABASE</div>
    <div>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">9</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="step-wrap" id="stepWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `projeto_mural_backend_trabalho_progress_${username}`;
  const STEP_KEY = `projeto_mural_backend_trabalho_step_${username}`;

  // 5ª de 6 peças do projeto interdisciplinar "Mural" — a PRIMEIRA peça com
  // código de verdade. Com as tabelas já criadas (peça 3, Banco de Dados),
  // o aluno escreve, no mesmo repositório mural-<usuario> (Codespace), as
  // funções JavaScript que usam supabase-js pra implementar as 5
  // funcionalidades do MVP. Só JavaScript aqui — nenhuma interface (HTML/
  // CSS) ainda; isso fica pra peça 6 (Programação de Aplicativos), e lá o
  // HTML/CSS já vem pronto, entregue pelo professor (o aluno só liga a
  // interface pronta a estas funções). Sem correção automática (código roda
  // no Codespace, contra um banco real) — visto do professor no final.
  const STEPS = [
    {
      titulo: 'Apresentação',
      corpo: `
Esta é a **5ª de 6 peças** do projeto Mural — e a **primeira com código de verdade**. O Mural tem banco pronto (peça anterior), mas nenhuma linha de código ainda conecta a aplicação a ele.

Você vai escrever as **funções de backend** (cadastro, login, criar post, carregar feed, curtir) em JavaScript. A interface visual (HTML/CSS) só vem na próxima matéria — e virá **pronta**, você só vai ligar essas funções a ela.

### O que entregar aqui

Um arquivo (\`app.js\` ou \`mural.js\`) no repositório \`mural-seuusuario\`, com 5 funções assíncronas usando a biblioteca \`supabase-js\`, cada uma testada manualmente pelo console do navegador.

### Como funciona aqui

1. Leia os blocos de conteúdo (biblioteca, cada função, tratamento de erro).
2. Escreva o código de verdade no Codespace.
3. Teste cada função pelo console e capture uma evidência.
4. Commite o arquivo e peça o visto ao professor.`
    },
    {
      titulo: 'Biblioteca vs. requisição na mão',
      corpo: `
Uma **biblioteca/SDK** (como \`supabase-js\`) encapsula chamadas HTTP repetitivas em funções prontas — em vez de montar a requisição HTTP na mão (que você observou na trilha de Redes), você chama um método.

### Faça

Adicione \`supabase-js\` ao projeto (CDN ou import) e crie o cliente com a **Project URL** e a **Publishable Key** do projeto \`mural\` (peça anterior, Banco de Dados).`
    },
    {
      titulo: 'cadastrarUsuario',
      corpo: `
Uma **função assíncrona** é uma operação que espera uma resposta (do banco) sem travar o resto do programa.

### Faça

Escreva:

§§§text
async function cadastrarUsuario(nome, turma, usuario, senha)
§§§

que faz \`insert\` na tabela \`usuarios\`.`
    },
    {
      titulo: 'fazerLogin',
      corpo: `
Uma consulta condicional (\`.eq()\`) filtra linhas por um valor específico.

### Faça

Escreva:

§§§text
async function fazerLogin(usuario, senha)
§§§

que faz \`select\` filtrando por usuário e senha, e retorna se autenticou.`
    },
    {
      titulo: 'criarPost',
      corpo: `
Um insert com relação grava a **FK** (quem é o autor) junto com o dado.

### Faça

Escreva:

§§§text
async function criarPost(autorId, texto)
§§§`
    },
    {
      titulo: 'carregarFeed',
      corpo: `
Select com **join** junta dados de duas tabelas relacionadas numa única consulta; **ordenação** define a sequência de exibição.

### Faça

Escreva:

§§§text
async function carregarFeed()
§§§

que retorna os posts com o nome do autor, mais recentes primeiro.`
    },
    {
      titulo: 'curtir',
      corpo: `
Uma operação **idempotente** não deve duplicar efeito se repetida — aqui, não deixar curtir o mesmo post duas vezes.

### Faça

Escreva:

§§§text
async function curtir(postId, usuarioId)
§§§

tratando a duplicidade (o \`unique constraint\` do banco ajuda, mas trate o erro no JavaScript também).`
    },
    {
      titulo: 'Tratamento de erro',
      corpo: `
Toda chamada ao Supabase retorna \`{ data, error }\` — ignorar \`error\` esconde falhas do usuário.

### Faça

Adicione \`try/catch\` e verificação de \`error\` em **todas** as funções escritas acima (\`cadastrarUsuario\`, \`fazerLogin\`, \`criarPost\`, \`carregarFeed\`, \`curtir\`).`
    },
    {
      titulo: 'Checklist final antes do visto',
      corpo: `
Teste cada função pelo console do navegador, capture uma evidência (print) de cada uma funcionando, e commite o arquivo. Confira:

- [ ] \`supabase-js\` importado e cliente criado.
- [ ] \`cadastrarUsuario\`, \`fazerLogin\`, \`criarPost\`, \`carregarFeed\`, \`curtir\` implementadas.
- [ ] Todas tratam erro (\`try/catch\` + \`error\` do Supabase).
- [ ] Evidência de teste de cada função.
- [ ] Arquivo (\`app.js\` ou \`mural.js\`) commitado no repositório.

Quando tudo estiver certo, avance e peça o visto — é isso que libera a última peça do projeto, em Programação de Aplicativos.`
    }
  ];

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  function loadStepIndex() {
    try {
      const n = parseInt(localStorage.getItem(STEP_KEY), 10);
      return Number.isInteger(n) && n >= 0 && n <= STEPS.length ? n : 0;
    } catch (e) { return 0; }
  }
  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  const savedProgress = loadProgress();
  let currentIndex = (savedProgress && savedProgress.completed) ? STEPS.length : loadStepIndex();

  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');
  lblStepTotal.textContent = STEPS.length + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de modelagem-dados-requisitos-trabalho.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('projeto_mural_backend_trabalho', label, { step: currentIndex + 1, total: STEPS.length + 1 });
    }
  }

  function renderNav(showBack, showNext) {
    return `
      <div class="step-nav">
        ${showBack ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}
        ${showNext ? '<button class="btn" id="btnNext">Próximo →</button>' : ''}
      </div>`;
  }

  function renderStep() {
    if (currentIndex >= STEPS.length) { renderVisto(); return; }
    saveStepIndex(currentIndex);

    const pct = Math.round((currentIndex / STEPS.length) * 100);
    progressFill.style.width = Math.min(pct, 100) + '%';
    lblStepNum.textContent = currentIndex + 1;

    const step = STEPS[currentIndex];
    reportStep(`Trabalho — ${step.titulo}`);
    stepWrap.innerHTML = `
      <div class="card">
        <h2>${escapeHtml(step.titulo)}</h2>
        <div class="md-body">${mdToHtml(step.corpo)}</div>
      </div>
      ${renderNav(currentIndex > 0, true)}
    `;
    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.addEventListener('click', () => { currentIndex--; renderStep(); });
    document.getElementById('btnNext').addEventListener('click', () => { currentIndex++; renderStep(); });
  }

  function renderVisto() {
    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length + 1;
    reportStep('Trabalho — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="card visto-box">
          <h2>✅ Atividade concluída</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
          <p>A última peça do projeto Mural (Programação de Aplicativos) já pode ser liberada pelo professor.</p>
        </div>
        ${renderNav(true, false)}
      `;
      document.getElementById('btnBack').addEventListener('click', () => { currentIndex = STEPS.length - 1; renderStep(); });
      return;
    }

    stepWrap.innerHTML = `
      <div class="card visto-box">
        <h2>🧑‍🏫 Etapa final — Visto do professor</h2>
        <p>Suas 5 funções (<code>cadastrarUsuario</code>, <code>fazerLogin</code>, <code>criarPost</code>, <code>carregarFeed</code>, <code>curtir</code>) estão escritas, testadas pelo console e commitadas no repositório <code>mural-seuusuario</code>?</p>
        <p>Chame o professor pra ver o código funcionando no console. Quando ele confirmar, peça o token de professor (Gestão → "Token — Dar Visto / Pular Etapa") e digite abaixo — é assim que a atividade é marcada como concluída.</p>
        <div class="visto-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="visto-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    document.getElementById('btnBack').addEventListener('click', () => { currentIndex = STEPS.length - 1; renderStep(); });

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'visto-msg erro';
        vistoMsg.textContent = 'Informe o token do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'visto-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'visto-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito aqui é o checklist de critérios pro professor conferir o
  // código JavaScript commitado no repositório do aluno.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Projeto Mural — Lógica de Backend com Supabase — Checklist de correção',
      subtitle: 'Trabalho (código JS real, testado no console) · Desenvolvimento de Sistemas 1 · Turma Sistemas',
      items: [
        { number: 1, title: 'Cliente Supabase', prompt: 'O cliente foi criado corretamente?', answer: 'supabase-js importado (CDN ou import) e cliente criado com a Project URL e a Publishable Key do projeto mural.' },
        { number: 2, title: 'As 5 funções', prompt: 'Todas foram implementadas?', answer: 'cadastrarUsuario (insert em usuarios), fazerLogin (select com .eq() por usuário/senha), criarPost (insert com FK autor_id), carregarFeed (select com join + ordenação por mais recente), curtir (insert em curtidas, tratando duplicidade).' },
        { number: 3, title: 'Tratamento de erro', prompt: 'Todas tratam erro?', answer: 'try/catch e verificação do campo error em todas as 5 funções.' },
        { number: 4, title: 'Evidência e commit', prompt: 'O aluno testou e commitou?', answer: 'Print/evidência de cada função rodando no console do navegador; arquivo (app.js ou mural.js) commitado no repositório mural-<usuario>.' }
      ],
      fileName: 'projeto-mural-backend-checklist.txt'
    });
  };

  renderStep();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
