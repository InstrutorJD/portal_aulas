<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Jogos: Central de Codificação — Motor Godot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:190px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--blue); color:var(--blue); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex:1 1 0%; min-height:90px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }
  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--blue); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:14px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--gold); }

  .explanation-box{
    background:#08111c; border:1px solid var(--blue-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--blue); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--gold); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); white-space:pre;
  }

  .given-vars{ font-size:10.5px; color:var(--ink-dim); margin-top:8px; }
  .given-vars b{ color:var(--gold); }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--gold); border:1px solid var(--blue-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(224,184,74,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--gold);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--gold); }

  textarea#codeInput{
    width:100%; flex:0 0 230px; min-height:140px; resize:vertical; background:#000; color:var(--blue);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5; tab-size:4;
  }
  textarea#codeInput:focus{ border-color:var(--blue); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .console{
    background:#08090f; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:0 0 100px; min-height:70px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--blue); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--blue); font-weight:bold; }
  .console .line.warn{ color:var(--gold); }

  /* Celular/telas estreitas: mesma regra das outras práticas de desafio —
     empilha tudo numa coluna só e deixa a página inteira rolar. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:200px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_godot_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/gdscript-challenge-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — CENTRAL DE CODIFICAÇÃO: MOTOR GODOT</div>
    <div>CONCLUÍDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Desafios</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>
          <div class="given-vars" id="givenVarsLabel" style="display:none;"></div>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo desafio →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Constrói, passo a passo, o pipeline de movimentação top-down do Guia
  // Definitivo Godot 4 (seção 6) como código GDScript de verdade: direção a
  // partir do Input (respeitando a pegadinha do eixo Y), detecção de
  // diagonal, normalização, velocidade final e deslocamento por delta —
  // fechando com uma função só que junta tudo. Só usa a sintaxe que o
  // shared/gdscript-challenge-engine.js reconhece (var/const/print/if-else/
  // for/func — ver esse arquivo pro porquê de Vector2/Array/while não
  // aparecerem aqui como código executável; eles são cobertos na Teoria).
  const CHALLENGES = [
    {
      id: 1,
      title: 'Direção X a partir do input',
      givenVars: ['pressionando_direita', 'pressionando_esquerda'],
      starter: '# crie a funcao direcaoX(direita, esquerda)\n# 1 se so a direita estiver pressionada\n# -1 se so a esquerda estiver pressionada\n# 0 nos outros casos (nenhuma ou as duas)\nfunc direcaoX(direita, esquerda):\n\t\n\n# depois, crie resultado chamando a funcao\nvar resultado = direcaoX(pressionando_direita, pressionando_esquerda)\n',
      explanation: 'Pra montar o vetor direção a partir do <code>Input.is_action_pressed()</code>, cada eixo soma ou subtrai 1 dependendo da tecla — combine condições com <code>&&</code> (e) e <code>!</code> (não).<pre>if direita && !esquerda:\n\treturn 1</pre>',
      desc: 'Crie a função <code>direcaoX(direita, esquerda)</code>, que devolve <b>1</b> se só <code>direita</code> estiver pressionada, <b>-1</b> se só <code>esquerda</code> estiver pressionada, e <b>0</b> nos outros casos (nenhuma, ou as duas ao mesmo tempo). Depois, crie <code>resultado</code> chamando a função com <code>pressionando_direita</code> e <code>pressionando_esquerda</code>.',
      hint: 'Use <code>if</code>/<code>else</code> aninhados: primeiro teste "direita e não esquerda"; depois, dentro do <code>else</code>, teste "esquerda e não direita". O <code>!</code> inverte um valor lógico.',
      solution: 'func direcaoX(direita, esquerda):\n\tif direita && !esquerda:\n\t\treturn 1\n\telse:\n\t\tif esquerda && !direita:\n\t\t\treturn -1\n\t\telse:\n\t\t\treturn 0\nvar resultado = direcaoX(pressionando_direita, pressionando_esquerda)',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { pressionando_direita: true, pressionando_esquerda: false }, expected: 1 },
        { values: { pressionando_direita: false, pressionando_esquerda: true }, expected: -1 },
        { values: { pressionando_direita: false, pressionando_esquerda: false }, expected: 0 },
        { values: { pressionando_direita: true, pressionando_esquerda: true }, expected: 0 }
      ]
    },
    {
      id: 2,
      title: 'Direção Y e a pegadinha do eixo',
      givenVars: ['pressionando_baixo', 'pressionando_cima'],
      starter: '# crie a funcao direcaoY(baixo, cima)\n# lembre: em Godot, Y positivo aponta pra BAIXO\n# 1 se so baixo estiver pressionado\n# -1 se so cima estiver pressionado\n# 0 nos outros casos\nfunc direcaoY(baixo, cima):\n\t\n\n# depois, crie resultado chamando a funcao\nvar resultado = direcaoY(pressionando_baixo, pressionando_cima)\n',
      explanation: 'Igual ao eixo X, só que invertido pela pegadinha do eixo Y: "Baixo" SOMA (Y positivo), "Cima" SUBTRAI (Y negativo).<pre>if baixo && !cima:\n\treturn 1</pre>',
      desc: 'Crie a função <code>direcaoY(baixo, cima)</code>. Lembre-se: na Godot, <b>Y positivo aponta pra baixo</b>. Ela deve devolver <b>1</b> se só <code>baixo</code> estiver pressionado, <b>-1</b> se só <code>cima</code> estiver pressionado, e <b>0</b> nos outros casos. Depois, crie <code>resultado</code> chamando a função com <code>pressionando_baixo</code> e <code>pressionando_cima</code>.',
      hint: 'Mesma estrutura do desafio anterior (direcaoX), só trocando os nomes — e lembrando que "Baixo" é o valor POSITIVO aqui, não "Cima".',
      solution: 'func direcaoY(baixo, cima):\n\tif baixo && !cima:\n\t\treturn 1\n\telse:\n\t\tif cima && !baixo:\n\t\t\treturn -1\n\t\telse:\n\t\t\treturn 0\nvar resultado = direcaoY(pressionando_baixo, pressionando_cima)',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { pressionando_baixo: true, pressionando_cima: false }, expected: 1 },
        { values: { pressionando_baixo: false, pressionando_cima: true }, expected: -1 },
        { values: { pressionando_baixo: false, pressionando_cima: false }, expected: 0 },
        { values: { pressionando_baixo: true, pressionando_cima: true }, expected: 0 }
      ]
    },
    {
      id: 3,
      title: 'Está andando na diagonal?',
      givenVars: ['direcao_x', 'direcao_y'],
      starter: '# as variaveis direcao_x e direcao_y ja existem (vindas dos desafios anteriores)\n# resultado deve ser true so quando as DUAS forem diferentes de 0 (diagonal)\n\nvar resultado\n\n',
      explanation: 'Andar na diagonal acontece quando os dois eixos estão ativos ao mesmo tempo — é justamente por isso que existe o próximo bloco de desafios (normalização).<pre>if x != 0 && y != 0:\n\tresultado = true</pre>',
      desc: 'As variáveis <code>direcao_x</code> e <code>direcao_y</code> já existem. <code>resultado</code> deve ser <code>true</code> só quando as DUAS forem diferentes de <b>0</b> (ou seja, o jogador está andando na diagonal); senão, <code>false</code>.',
      hint: 'Use <code>!=</code> pra checar "diferente de zero" nos dois eixos ao mesmo tempo, combinando com <code>&&</code>.',
      solution: 'var resultado\nif direcao_x != 0 && direcao_y != 0:\n\tresultado = true\nelse:\n\tresultado = false',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { direcao_x: 1, direcao_y: 0 }, expected: false },
        { values: { direcao_x: 0, direcao_y: -1 }, expected: false },
        { values: { direcao_x: 1, direcao_y: -1 }, expected: true },
        { values: { direcao_x: 0, direcao_y: 0 }, expected: false }
      ]
    },
    {
      id: 4,
      title: 'Normalizando o eixo X',
      givenVars: ['direcao_x', 'magnitude'],
      starter: '# direcao_x e magnitude ja existem (magnitude ja foi calculada com Pitagoras)\n# crie resultado com direcao_x dividido pela magnitude\n\n',
      explanation: 'Normalizar significa dividir cada componente pela magnitude (o "tamanho") total do vetor, deixando o vetor com tamanho 1 — é o que <code>.normalized()</code> faz por trás dos panos.<pre>var x_normalizado = direcao_x / magnitude</pre>',
      desc: 'As variáveis <code>direcao_x</code> e <code>magnitude</code> já existem. Crie <code>resultado</code> com <code>direcao_x</code> dividido por <code>magnitude</code> — o componente X do vetor já normalizado.',
      hint: 'Normalizar é só dividir o componente pela magnitude total do vetor.',
      solution: 'var resultado = direcao_x / magnitude',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { direcao_x: 1, magnitude: 2 }, expected: 0.5 },
        { values: { direcao_x: -1, magnitude: 2 }, expected: -0.5 },
        { values: { direcao_x: 0, magnitude: 2 }, expected: 0 },
        { values: { direcao_x: 2, magnitude: 4 }, expected: 0.5 }
      ]
    },
    {
      id: 5,
      title: 'Normalizando o eixo Y',
      givenVars: ['direcao_y', 'magnitude'],
      starter: '# direcao_y e magnitude ja existem (magnitude ja foi calculada com Pitagoras)\n# crie resultado com direcao_y dividido pela magnitude\n\n',
      explanation: 'Mesma ideia do eixo X, só que aplicada ao componente Y do vetor.<pre>var y_normalizado = direcao_y / magnitude</pre>',
      desc: 'As variáveis <code>direcao_y</code> e <code>magnitude</code> já existem. Crie <code>resultado</code> com <code>direcao_y</code> dividido por <code>magnitude</code> — o componente Y do vetor já normalizado.',
      hint: 'Mesma conta do desafio anterior, agora com direcao_y no lugar de direcao_x.',
      solution: 'var resultado = direcao_y / magnitude',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { direcao_y: 1, magnitude: 2 }, expected: 0.5 },
        { values: { direcao_y: -1, magnitude: 2 }, expected: -0.5 },
        { values: { direcao_y: 0, magnitude: 2 }, expected: 0 },
        { values: { direcao_y: 2, magnitude: 4 }, expected: 0.5 }
      ]
    },
    {
      id: 6,
      title: 'Velocidade final no eixo X',
      givenVars: ['direcao_x_normalizada', 'velocidade_jogador'],
      starter: '# direcao_x_normalizada e velocidade_jogador ja existem\n# crie resultado multiplicando as duas\n\n',
      explanation: 'A propriedade <code>velocity</code> do CharacterBody2D é a direção normalizada multiplicada pela velocidade escalar do jogador.<pre>velocity.x = direcao.x * velocidade_do_jogador</pre>',
      desc: 'As variáveis <code>direcao_x_normalizada</code> e <code>velocidade_jogador</code> já existem. Crie <code>resultado</code> multiplicando as duas.',
      hint: 'É só multiplicar as duas variáveis já existentes.',
      solution: 'var resultado = direcao_x_normalizada * velocidade_jogador',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { direcao_x_normalizada: 0.5, velocidade_jogador: 200 }, expected: 100 },
        { values: { direcao_x_normalizada: -1, velocidade_jogador: 150 }, expected: -150 },
        { values: { direcao_x_normalizada: 0, velocidade_jogador: 300 }, expected: 0 },
        { values: { direcao_x_normalizada: 1, velocidade_jogador: 250 }, expected: 250 }
      ]
    },
    {
      id: 7,
      title: 'Velocidade final no eixo Y',
      givenVars: ['direcao_y_normalizada', 'velocidade_jogador'],
      starter: '# direcao_y_normalizada e velocidade_jogador ja existem\n# crie resultado multiplicando as duas\n\n',
      explanation: 'Mesma conta do eixo X, agora pro componente Y da velocidade final.<pre>velocity.y = direcao.y * velocidade_do_jogador</pre>',
      desc: 'As variáveis <code>direcao_y_normalizada</code> e <code>velocidade_jogador</code> já existem. Crie <code>resultado</code> multiplicando as duas.',
      hint: 'Mesma conta do desafio anterior, agora com direcao_y_normalizada no lugar de direcao_x_normalizada.',
      solution: 'var resultado = direcao_y_normalizada * velocidade_jogador',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { direcao_y_normalizada: 0.5, velocidade_jogador: 200 }, expected: 100 },
        { values: { direcao_y_normalizada: -1, velocidade_jogador: 150 }, expected: -150 },
        { values: { direcao_y_normalizada: 0, velocidade_jogador: 300 }, expected: 0 },
        { values: { direcao_y_normalizada: 1, velocidade_jogador: 250 }, expected: 250 }
      ]
    },
    {
      id: 8,
      title: 'Deslocamento do quadro (delta)',
      givenVars: ['velocidade_x', 'delta'],
      starter: '# velocidade_x e delta ja existem\n# crie resultado multiplicando as duas\n\n',
      explanation: 'Dentro de <code>_physics_process(delta)</code> (não <code>_process(delta)</code> — código que mexe com CharacterBody2D precisa do ritmo fixo da física), o deslocamento de um quadro é a velocidade vezes o tempo daquele quadro — é isso que torna o movimento independente da taxa de FPS.<pre>var deslocamento = velocidade * delta</pre>',
      desc: 'As variáveis <code>velocidade_x</code> e <code>delta</code> já existem. Crie <code>resultado</code> multiplicando as duas — o deslocamento deste quadro.',
      hint: 'É só multiplicar a velocidade pelo tempo do quadro (delta).',
      solution: 'var resultado = velocidade_x * delta',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { velocidade_x: 100, delta: 0.5 }, expected: 50 },
        { values: { velocidade_x: 200, delta: 0.25 }, expected: 50 },
        { values: { velocidade_x: -160, delta: 0.5 }, expected: -80 },
        { values: { velocidade_x: 0, delta: 0.5 }, expected: 0 }
      ]
    },
    {
      id: 9,
      title: 'Nova posição após um quadro',
      givenVars: ['posicao_x', 'deslocamento_x'],
      starter: '# posicao_x e deslocamento_x ja existem\n# crie resultado somando as duas\n\n',
      explanation: 'A posição nova é sempre a posição atual somada ao deslocamento calculado naquele quadro.<pre>position.x += deslocamento.x</pre>',
      desc: 'As variáveis <code>posicao_x</code> e <code>deslocamento_x</code> já existem. Crie <code>resultado</code> somando as duas — a nova posição do jogador depois deste quadro.',
      hint: 'É só somar a posição atual com o deslocamento deste quadro.',
      solution: 'var resultado = posicao_x + deslocamento_x',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { posicao_x: 100, deslocamento_x: 50 }, expected: 150 },
        { values: { posicao_x: 0, deslocamento_x: -30 }, expected: -30 },
        { values: { posicao_x: 200, deslocamento_x: 0 }, expected: 200 },
        { values: { posicao_x: 500, deslocamento_x: 25 }, expected: 525 }
      ]
    },
    {
      id: 10,
      title: 'Um quadro completo de movimento',
      givenVars: ['direcao_normalizada', 'velocidade_jogador', 'posicao_x', 'delta'],
      starter: '# crie a funcao moverEixo(direcao, velocidade, posicao, delta)\n# que devolve a nova posicao apos este quadro\nfunc moverEixo(direcao, velocidade, posicao, delta):\n\t\n\n# depois, crie resultado chamando a funcao\nvar resultado = moverEixo(direcao_normalizada, velocidade_jogador, posicao_x, delta)\n',
      explanation: 'É o pipeline inteiro da movimentação num só lugar: direção normalizada vezes velocidade dá a velocidade final; velocidade final vezes delta dá o deslocamento do quadro; deslocamento somado à posição atual dá a nova posição.<pre>func moverEixo(direcao, velocidade, posicao, delta):\n\treturn posicao + direcao * velocidade * delta</pre>',
      desc: 'Crie a função <code>moverEixo(direcao, velocidade, posicao, delta)</code>, que devolve a nova posição depois de um quadro (direção normalizada vezes velocidade vezes delta, somada à posição atual). Depois, crie <code>resultado</code> chamando a função com <code>direcao_normalizada</code>, <code>velocidade_jogador</code>, <code>posicao_x</code> e <code>delta</code>.',
      hint: 'Junte tudo numa linha só dentro do <code>return</code>: posição + direção * velocidade * delta.',
      solution: 'func moverEixo(direcao, velocidade, posicao, delta):\n\treturn posicao + direcao * velocidade * delta\nvar resultado = moverEixo(direcao_normalizada, velocidade_jogador, posicao_x, delta)',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { direcao_normalizada: 0.5, velocidade_jogador: 200, posicao_x: 100, delta: 0.5 }, expected: 150 },
        { values: { direcao_normalizada: -1, velocidade_jogador: 160, posicao_x: 300, delta: 0.5 }, expected: 220 },
        { values: { direcao_normalizada: 0, velocidade_jogador: 300, posicao_x: 50, delta: 1 }, expected: 50 },
        { values: { direcao_normalizada: 1, velocidade_jogador: 100, posicao_x: 0, delta: 0.25 }, expected: 25 }
      ]
    }
  ];

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — Motor Godot',
      subtitle: 'Prática · Trilha Motor Godot · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = Object.entries(t.values || {}).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join(', ');
          const prefix = inputs ? `Com ${inputs}` : 'Sem variáveis de entrada';
          if (c.check.type === 'console') {
            return `${prefix} → print deve mostrar ${JSON.stringify(t.expected)}`;
          }
          return `${prefix} → ${c.check.name} deve ser ${JSON.stringify(t.expected)}`;
        }).join('\n') + '\n\nCódigo de referência (não é a única forma correta):\n' + c.solution
      })),
      fileName: 'cod-godot-pratica-gabarito.txt'
    });
  };

  window.PortalGdscriptChallenges.run({
    activityLocation: 'cod_godot_pratica',
    challenges: CHALLENGES,
    reportLabel: 'Codificação — Motor Godot'
  });
</script>
