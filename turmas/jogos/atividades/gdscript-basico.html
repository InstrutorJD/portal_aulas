<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — A Missão do Godi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#0f1420; --panel2:#0c101a; --line:#22304a;
    --blue:#5fc9ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e2e6; --ink-dim:#68808f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#050810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(95,201,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .godi-row{ display:flex; align-items:flex-start; gap:12px; }
  .godi-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(95,201,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .godi-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(95,201,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04182a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(95,201,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  /* Celular: deixa a página rolar em vez de prender tudo numa tela só, e
     tira padding/borda que só rouba espaço útil numa tela pequena. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'gdscript_basico';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/quiz-teoria-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>GDSCRIPT — A MISSÃO DO GODI</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">10</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Bipe-bope! Eu sou o <b>Godi</b>, um robozinho que vive dentro do motor <b>Godot</b>! Vim te apresentar o <b>GDScript</b> — a linguagem própria do Godot, feita sob medida pra fazer jogos nesse motor.',
      question: {
        prompt: 'Para qual motor de jogos o GDScript foi criado?',
        options: ['Godot', 'Unity', 'Unreal Engine', 'GameMaker'],
        correctIndex: 0,
        explanation: 'Isso mesmo! GDScript é a linguagem nativa do Godot Engine, feita sob medida pra ele.'
      }
    },
    {
      story: 'Diferente do C#, eu não uso chaves <b>{ }</b> para marcar um bloco de código. Em vez disso, uso a <b>indentação</b> — os espaços no início da linha — pra saber onde um bloco começa e termina.',
      question: {
        prompt: 'O que define onde um bloco de código começa e termina em GDScript?',
        options: ['A indentação (espaços no início da linha)', 'As chaves { }', 'O ponto e vírgula (;)', 'Os parênteses ( )'],
        correctIndex: 0,
        explanation: 'Isso! GDScript usa indentação para organizar blocos de código, sem precisar de chaves.'
      }
    },
    {
      story: 'Quando quero mostrar uma mensagem na tela, uso o comando <b>print()</b>. É bem mais direto que em C#!',
      question: {
        prompt: 'Qual comando exibe um texto na tela em GDScript?',
        options: ['print()', 'Console.WriteLine()', 'echo()', 'show()'],
        correctIndex: 0,
        explanation: 'Correto! Em GDScript, o comando pra exibir texto é print(), bem mais enxuto que em C#.'
      }
    },
    {
      story: 'Pra guardar informações, uso a palavra <b>var</b>. Por exemplo: <code>var vida = 100</code> já cria a variável vida com valor 100 — sem precisar escrever o tipo!',
      question: {
        prompt: 'Qual palavra é usada para criar uma variável em GDScript?',
        options: ['var', 'int', 'let', 'variable'],
        correctIndex: 0,
        explanation: 'Isso! Toda variável em GDScript começa com a palavra var, seguida do nome e, opcionalmente, do valor inicial.'
      }
    },
    {
      story: 'Mesmo sem escrever o tipo sempre, cada valor em GDScript ainda tem um tipo por trás: <b>int</b> (número inteiro), <b>float</b> (número com casas decimais), <b>String</b> (texto) ou <b>bool</b> (verdadeiro/falso).',
      question: {
        prompt: 'Qual tipo de dado guarda um texto em GDScript?',
        options: ['String', 'int', 'bool', 'var'],
        correctIndex: 0,
        explanation: 'Exato! String é o tipo usado para guardar texto em GDScript — assim como em C#.'
      }
    },
    {
      story: 'Pra deixar um recadinho no meio do código, uso o símbolo <b>#</b>. Tudo depois dele, na mesma linha, é ignorado pelo Godot.',
      question: {
        prompt: 'Como se escreve um comentário de uma linha em GDScript?',
        options: ['# comentário', '// comentário', '<!-- comentário -->', '** comentário **'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Em GDScript, o símbolo # (não // como em C#) transforma o resto da linha em comentário.'
      }
    },
    {
      story: 'Assim como em C#, uso <b>if</b> pra decidir: "se a vida chegar a zero, acaba o jogo". A diferença é que, em vez de chaves, uso dois pontos <b>( : )</b> seguidos de uma linha indentada.',
      question: {
        prompt: 'O que substitui as chaves { } de C# para marcar o bloco de um if em GDScript?',
        options: ['Dois pontos (:) seguidos de uma linha indentada', 'Um ponto e vírgula (;)', 'Parênteses duplos (( ))', 'Nada, o bloco não precisa de marcação'],
        correctIndex: 0,
        explanation: 'Isso! Em GDScript, o if termina com dois pontos, e o bloco que ele controla é a linha (ou linhas) indentada logo abaixo.'
      }
    },
    {
      story: 'Pra repetir uma ação várias vezes, uso <b>for</b>. Por exemplo: <code>for i in range(5):</code> repete 5 vezes, uma pra cada valor de i entre 0 e 4.',
      question: {
        prompt: 'Qual comando repete um bloco de código um número certo de vezes em GDScript, usando range()?',
        options: ['for', 'while', 'print', 'var'],
        correctIndex: 0,
        explanation: 'Isso! O for i in range(n) é a forma mais comum de repetir um bloco um número certo de vezes em GDScript.'
      }
    },
    {
      story: 'Quando quero agrupar um conjunto de ações num "pacote" que posso chamar depois, crio uma função com a palavra <b>func</b>. Por exemplo: <code>func atacar():</code>',
      question: {
        prompt: 'Qual palavra é usada para criar uma função em GDScript?',
        options: ['func', 'function', 'def', 'method'],
        correctIndex: 0,
        explanation: 'Correto! Funções em GDScript começam com a palavra func, seguida do nome e parênteses.'
      }
    },
    {
      story: 'Por fim, todo script do Godot geralmente começa com a palavra <b>extends</b>, indicando de qual tipo de objeto do jogo aquele script "herda" comportamentos — como <code>extends Node2D</code>.',
      question: {
        prompt: 'O que a palavra extends indica no topo de um script GDScript?',
        options: ['De qual tipo de objeto do Godot aquele script herda comportamentos', 'O nome do arquivo em que aquele script está salvo dentro do projeto', 'A versão exata do motor Godot que está instalada no computador do aluno', 'O idioma configurado nas opções de texto e legendas do jogo'],
        correctIndex: 0,
        explanation: 'Isso! extends conecta seu script a um tipo de nó do Godot (como Node2D), herdando os comportamentos prontos daquele tipo.'
      }
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // sem o professor precisar abrir o módulo pra achar o botão.

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'GDScript Básico — A Missão do Godi',
      subtitle: 'Aula Teórica · Trilha GDScript · Turma Jogos Digitais',
      capacidade: 'Reconhecer a sintaxe básica da linguagem GDScript (variáveis, tipos de dados, comandos de saída, comentários, condicionais, laços de repetição e funções) e sua relação com o motor Godot.',
      steps: STEPS,
      fileName: 'gdscript-basico-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Agora é hora de resolver os chamados da Central de Suporte — desafios práticos pra fixar GDScript antes da aula com o Godot.'
    });
  };

  // Mesmo esquema do generateSlidesForGestao acima: exposto sempre pra a aba
  // "Gestão" poder chamar remotamente, num iframe oculto, e baixar um .txt
  // com pergunta + resposta esperada de cada etapa — sem o professor precisar
  // decorar as respostas ou abrir o módulo pra conferir.

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'GDScript Básico — A Missão do Godi',
      subtitle: 'Aula Teórica · Trilha GDScript · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'gdscript-basico-gabarito.txt'
    });
  };

  // Só o professor vê o botão de gerar slides aqui dentro do módulo — é
  // material de apoio pra ele apresentar em aula, não faz parte da jornada
  // do aluno.

  window.PortalQuizTeoria.run({
    activityLocation: "gdscript_basico",
    steps: STEPS,
    reportLabel: "GDScript Básico — A Missão do Godi",
    mentor: { rowClass: "godi", avatar: "🤖", name: "Godi, o robô do Godot" },
    finishPassed: {
      title: "Missão do Godi concluída!",
      introHtml: "<p>Você conheceu o GDScript, a linguagem nativa do Godot, e viu como ela se compara ao C# que já estudou.</p>",
      closingHtml: "<p>Agora vá até a Central de Suporte praticar esses conceitos — e já vai chegar a hora da aula prática no Godot!</p>",
      restartLabel: "🔁 Refazer a Missão"
    }
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
