<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>

<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — PERSONAGEM JOGÁVEL EM GODOT (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">6</span></span>

</div>

<script>
  const STEPS = [
    {
      story: 'Olá de novo! Sou a <b>Bia</b>, a joaninha debugger — hoje vamos aprofundar a construção do <b>personagem jogável</b> na Godot. Existem dois nós de física pra corpos que se movem: <code>RigidBody2D</code> e <code>CharacterBody2D</code>. O RigidBody2D é controlado pela <b>simulação de física</b> do motor — gravidade, impulsos e colisões acontecem automaticamente, sem você comandar cada movimento por script. Já o <code>CharacterBody2D</code> dá ao programador o <b>controle cinemático absoluto</b>: você decide, via GDScript, exatamente como e quando o personagem se move — por isso é o nó certo pra um personagem jogável, onde o jogador precisa de resposta previsível ao input.',
      question: {
        prompt: 'Por que o CharacterBody2D é a escolha certa pra um personagem jogável controlado pelo jogador, em vez do RigidBody2D?',
        options: [
          'Porque dá controle cinemático absoluto via script — o movimento responde exatamente ao que o código manda, sem a física automática do motor interferir',
          'Porque RigidBody2D não pode ter Sprite2D como filho',
          'Porque CharacterBody2D é mais bonito visualmente que RigidBody2D',
          'Porque RigidBody2D só funciona em jogos 3D, nunca em 2D'
        ],
        correctIndex: 0,
        explanation: 'Isso! O jogador precisa de resposta previsível e imediata ao input — é exatamente isso que o controle cinemático do CharacterBody2D oferece, ao contrário do RigidBody2D, que é regido pela simulação automática de física do motor.'
      }
    },
    {
      story: 'O nó <code>Sprite2D</code> é quem mostra a textura/animação do personagem na tela. Só que, por padrão, a Godot 4 aplica um filtro de textura <b>Linear</b> — que suaviza (borra) os pixels ao ampliar a imagem. Pra um jogo em estilo <b>Pixel Art</b>, isso é um problema: os pixels ficam borrados em vez de nítidos e quadrados. A correção fica em <code>Project > Project Settings > Rendering > Textures > Default Texture Filter</code>: trocar de <b>Linear</b> pra <b>Nearest</b>, que preserva a nitidez de cada pixel.',
      question: {
        prompt: 'O sprite do personagem, feito em Pixel Art, aparece borrado/suavizado na tela em vez de nítido. Qual ajuste do projeto resolve isso?',
        options: [
          'Trocar o Default Texture Filter de Linear pra Nearest, em Project Settings > Rendering > Textures',
          'Aumentar o tamanho do CollisionShape2D',
          'Mudar o Z Index do Sprite2D',
          'Renomear o nó de Sprite2D pra Sprite2DPixelArt'
        ],
        correctIndex: 0,
        explanation: 'Isso! O filtro Linear (padrão) suaviza a textura ao escalar, borrando os pixels — o Nearest preserva cada pixel nítido e quadrado, essencial pro estilo Pixel Art.'
      }
    },
    {
      story: 'O <code>CollisionShape2D</code> dá o "volume" físico que faz o CharacterBody2D interagir de verdade com o cenário — sem ele, o personagem atravessa paredes e não emite nenhum sinal de colisão. Pra personagens dinâmicos, a recomendação é usar um <code>CircleShape2D</code> (círculo) em vez de um retângulo: a forma circular desliza melhor em cantos e quinas do cenário, sem ficar "presa" em arestas microscópicas. O raio deve focar na <b>base</b> do personagem (pés/corpo principal) — acessórios que se destacam visualmente, como a ponta de um chapéu, não devem gerar bloqueio físico irreal.',
      question: {
        prompt: 'Por que a arquitetura recomenda usar um CircleShape2D (em vez de um retângulo) como colisor de um personagem dinâmico?',
        options: [
          'Porque a geometria circular desliza melhor em cantos e quinas do cenário, sem prender o personagem em arestas microscópicas',
          'Porque círculos ocupam menos espaço em disco que retângulos',
          'Porque CircleShape2D é a única forma que a Godot 4 reconhece',
          'Porque círculos fazem o personagem correr mais rápido automaticamente'
        ],
        correctIndex: 0,
        explanation: 'Isso! Um colisor circular evita que o personagem "engasgue" em pequenas irregularidades de canto — por isso é a recomendação padrão pra personagens dinâmicos que precisam deslizar suavemente pelo cenário.'
      }
    },
    {
      story: 'No sistema de coordenadas da Godot, a origem global fica no canto superior esquerdo da tela — mas cada nó também tem sua própria origem local, o <b>ponto de pivô</b> ao redor do qual ele rotaciona e escala. Pra manter esse comportamento previsível, os nós filhos (Sprite2D, CollisionShape2D) devem ficar <b>centralizados em (0,0)</b> em relação ao nó pai. Um deslocamento (offset) manual desse centro faz o personagem rotacionar em torno de um eixo excêntrico — a rotação "puxa" pra um lado, em vez de girar no próprio centro visual.',
      question: {
        prompt: 'O personagem, ao rotacionar, parece "girar em torno de um ponto fora do próprio corpo", em vez de girar no próprio centro. Qual é a causa mais provável?',
        options: [
          'Os nós filhos (Sprite2D, CollisionShape2D) não estão centralizados em (0,0) em relação ao nó pai — o pivô ficou deslocado',
          'O CharacterBody2D foi trocado por engano por um RigidBody2D',
          'O Z Index do personagem está negativo',
          'A velocidade do personagem está negativa'
        ],
        correctIndex: 0,
        explanation: 'Exato! Quando o "ponto de pivô" (a origem local dos nós filhos) não está centralizado em (0,0), a rotação passa a girar em torno de um eixo excêntrico — a correção é reposicionar Sprite2D e CollisionShape2D de volta ao centro do nó pai.'
      }
    },
    {
      story: 'Mesmo com a física e a geometria certas, ainda falta garantir que o personagem apareça na <b>camada visual</b> correta. A Godot 4 organiza a ordem de desenho através da propriedade <code>Z Index</code> (dentro da categoria <i>Ordering</i>, no Inspector de qualquer CanvasItem). Por padrão, elementos de cenário (o piso, o fundo) devem ocupar o índice <b>0</b>, enquanto o personagem jogável deve ocupar o índice <b>1 ou superior</b> — assim, o motor sempre desenha o personagem <b>por cima</b> da base do nível, evitando que ele pareça "enterrado" no chão.',
      question: {
        prompt: 'O personagem aparece visualmente "atrás" do piso do cenário, como se estivesse enterrado nele. Qual ajuste resolve isso?',
        options: [
          'Aumentar o Z Index do personagem pra um valor maior que o Z Index do cenário (ex: 1 ou mais, contra 0 do piso)',
          'Diminuir a velocidade do personagem',
          'Trocar o CollisionShape2D por um Sprite2D',
          'Mover o personagem pra fora da Main Scene'
        ],
        correctIndex: 0,
        explanation: 'Isso! O Z Index define a ordem de desenho — com o cenário no índice 0 e o personagem em 1 ou mais, o motor garante que o personagem sempre seja desenhado por cima da base do nível.'
      }
    },
    {
      story: 'Pra fechar, vale reforçar a filosofia "tudo é uma cena": o personagem deve ser encapsulado na própria cena (<code>.tscn</code>), separado da cena principal do jogo — isso evita a "poluição de cena" (excesso de nós desorganizados) e permite reaproveitar o mesmo jogador em várias fases. A convenção de nomenclatura da Godot usa <b>snake_case</b> pra ARQUIVOS (<code>jogador.tscn</code>, <code>jogador.gd</code>) e <b>PascalCase</b> pra NÓS (<code>Jogador</code>, <code>Sprite2D</code>). E a estrutura de pastas recomendada separa cenas de assets: <code>res://scenes/jogador/</code> (cena + script do personagem), <code>res://scenes/jogo/</code> (cena principal), <code>res://assets/sprites/</code> e <code>res://assets/audio/</code>.',
      question: {
        prompt: 'Seguindo a convenção de nomenclatura da Godot descrita na arquitetura, qual par de nomes está correto pro arquivo da cena do personagem e pro nome do nó raiz dela?',
        options: [
          'Arquivo: jogador.tscn (snake_case) — Nó raiz: Jogador (PascalCase)',
          'Arquivo: Jogador.TSCN (PascalCase) — Nó raiz: jogador (snake_case)',
          'Arquivo: JOGADOR.tscn (tudo maiúsculo) — Nó raiz: jogador-node (kebab-case)',
          'Não existe convenção nenhuma de nomenclatura na Godot'
        ],
        correctIndex: 0,
        explanation: 'Isso! O padrão é snake_case pra nomes de arquivo (jogador.tscn, jogador.gd) e PascalCase pra nomes de nós (Jogador) — seguir essa convenção deixa o projeto consistente e fácil de navegar.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Codificação de Jogos — Motor Godot: Personagem Jogável',
      subtitle: 'Aula Teórica · Trilha Motor Godot: Personagem Jogável · Turma Jogos Digitais',
      capacidade: 'Aplicar a arquitetura de nós (CharacterBody2D, Sprite2D, CollisionShape2D) e as boas práticas de configuração, geometria e organização de cenas na estruturação de um personagem jogável em Godot 4.',
      steps: STEPS,
      fileName: 'cod-godot-personagem-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Codificação: Personagem Jogável" no Portal de Aulas para os alunos escreverem código de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — Motor Godot: Personagem Jogável',
      subtitle: 'Aula Teórica · Trilha Motor Godot: Personagem Jogável · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'cod-godot-personagem-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "cod_godot_personagem_teoria",
    steps: STEPS,
    reportLabel: "Codificação — Personagem Jogável em Godot",
    mentor: { rowClass: "bia", avatar: "🐞", name: "Bia, a Joaninha Debugger" },
    finishPassed: {
      title: "Personagem Jogável em Godot concluído!",
      introHtml: "<p>Você já sabe escolher CharacterBody2D, ajustar o filtro de textura pra Pixel Art, usar CircleShape2D como colisor, centralizar o pivô, organizar o Z Index e seguir a convenção de nomes e pastas da Godot.</p>",
      closingHtml: "<p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Codificação.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>
