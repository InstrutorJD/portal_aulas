<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <!-- Aula 07, Parte 4: DER de exemplo do app de delivery (clientes 1:N
       pedidos 1:N itens_pedido N:1 produtos). -->
  <rect x="0" y="0" width="1100" height="400" rx="18" fill="#0f1623"/>

  <text x="550" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#eef2f8">DER do delivery</text>
  <text x="550" y="72" text-anchor="middle" font-size="15" fill="#9aa6ba">
    <tspan font-weight="800" fill="#f0d050">PK</tspan> = chave primária ·
    <tspan font-weight="800" fill="#4fd1c5">FK</tspan> = chave estrangeira ·
    <tspan font-weight="800" fill="#eef2f8">1 → N</tspan> = um para muitos
  </text>

  <!-- Ligações (desenhadas antes das caixas) -->
  <g fill="none" stroke="#9aa6ba" stroke-width="2.5">
    <path d="M240,177 H270 V211 H300"/>
    <path d="M520,177 H550 V211 H580"/>
    <path d="M860,177 H830 V245 H800"/>
  </g>
  <g font-size="16" font-weight="800" fill="#eef2f8">
    <text x="248" y="168">1</text>
    <text x="282" y="204">N</text>
    <text x="528" y="168">1</text>
    <text x="562" y="204">N</text>
    <text x="844" y="168">1</text>
    <text x="808" y="238">N</text>
  </g>

  <!-- clientes -->
  <g>
    <rect x="20" y="110" width="220" height="192" rx="12" fill="#142133" stroke="#7c9cff" stroke-width="2"/>
    <rect x="20" y="110" width="220" height="40" rx="12" fill="#7c9cff" fill-opacity="0.22"/>
    <text x="130" y="137" text-anchor="middle" font-size="18" font-weight="800" fill="#eef2f8">clientes</text>
    <g font-size="15">
      <rect x="30" y="165" width="30" height="22" rx="5" fill="#f0d050" fill-opacity="0.2"/>
      <text x="45" y="181" text-anchor="middle" font-size="12" font-weight="800" fill="#f0d050">PK</text>
      <text x="68" y="182" font-weight="700" fill="#eef2f8">id</text>
      <text x="230" y="182" text-anchor="end" fill="#9aa6ba">serial</text>
      <text x="68" y="216" fill="#eef2f8">nome</text>
      <text x="230" y="216" text-anchor="end" fill="#9aa6ba">text</text>
      <text x="68" y="250" fill="#eef2f8">telefone</text>
      <text x="230" y="250" text-anchor="end" fill="#9aa6ba">text</text>
      <text x="68" y="284" fill="#eef2f8">cidade</text>
      <text x="230" y="284" text-anchor="end" fill="#9aa6ba">text</text>
    </g>
  </g>

  <!-- pedidos -->
  <g>
    <rect x="300" y="110" width="220" height="226" rx="12" fill="#142133" stroke="#7c9cff" stroke-width="2"/>
    <rect x="300" y="110" width="220" height="40" rx="12" fill="#7c9cff" fill-opacity="0.22"/>
    <text x="410" y="137" text-anchor="middle" font-size="18" font-weight="800" fill="#eef2f8">pedidos</text>
    <g font-size="15">
      <rect x="310" y="165" width="30" height="22" rx="5" fill="#f0d050" fill-opacity="0.2"/>
      <text x="325" y="181" text-anchor="middle" font-size="12" font-weight="800" fill="#f0d050">PK</text>
      <text x="348" y="182" font-weight="700" fill="#eef2f8">id</text>
      <text x="510" y="182" text-anchor="end" fill="#9aa6ba">serial</text>
      <rect x="310" y="199" width="30" height="22" rx="5" fill="#4fd1c5" fill-opacity="0.2"/>
      <text x="325" y="215" text-anchor="middle" font-size="12" font-weight="800" fill="#4fd1c5">FK</text>
      <text x="348" y="216" font-weight="700" fill="#eef2f8">cliente_id</text>
      <text x="510" y="216" text-anchor="end" fill="#9aa6ba">int</text>
      <text x="348" y="250" fill="#eef2f8">total</text>
      <text x="510" y="250" text-anchor="end" fill="#9aa6ba">numeric</text>
      <text x="348" y="284" fill="#eef2f8">status</text>
      <text x="510" y="284" text-anchor="end" fill="#9aa6ba">text</text>
      <text x="348" y="318" fill="#eef2f8">criado_em</text>
      <text x="510" y="318" text-anchor="end" fill="#9aa6ba">timestamptz</text>
    </g>
  </g>

  <!-- itens_pedido -->
  <g>
    <rect x="580" y="110" width="220" height="192" rx="12" fill="#142133" stroke="#7c9cff" stroke-width="2"/>
    <rect x="580" y="110" width="220" height="40" rx="12" fill="#7c9cff" fill-opacity="0.22"/>
    <text x="690" y="137" text-anchor="middle" font-size="18" font-weight="800" fill="#eef2f8">itens_pedido</text>
    <g font-size="15">
      <rect x="590" y="165" width="30" height="22" rx="5" fill="#f0d050" fill-opacity="0.2"/>
      <text x="605" y="181" text-anchor="middle" font-size="12" font-weight="800" fill="#f0d050">PK</text>
      <text x="628" y="182" font-weight="700" fill="#eef2f8">id</text>
      <text x="790" y="182" text-anchor="end" fill="#9aa6ba">serial</text>
      <rect x="590" y="199" width="30" height="22" rx="5" fill="#4fd1c5" fill-opacity="0.2"/>
      <text x="605" y="215" text-anchor="middle" font-size="12" font-weight="800" fill="#4fd1c5">FK</text>
      <text x="628" y="216" font-weight="700" fill="#eef2f8">pedido_id</text>
      <text x="790" y="216" text-anchor="end" fill="#9aa6ba">int</text>
      <rect x="590" y="233" width="30" height="22" rx="5" fill="#4fd1c5" fill-opacity="0.2"/>
      <text x="605" y="249" text-anchor="middle" font-size="12" font-weight="800" fill="#4fd1c5">FK</text>
      <text x="628" y="250" font-weight="700" fill="#eef2f8">produto_id</text>
      <text x="790" y="250" text-anchor="end" fill="#9aa6ba">int</text>
      <text x="628" y="284" fill="#eef2f8">quantidade</text>
      <text x="790" y="284" text-anchor="end" fill="#9aa6ba">int</text>
    </g>
  </g>

  <!-- produtos -->
  <g>
    <rect x="860" y="110" width="220" height="158" rx="12" fill="#142133" stroke="#7c9cff" stroke-width="2"/>
    <rect x="860" y="110" width="220" height="40" rx="12" fill="#7c9cff" fill-opacity="0.22"/>
    <text x="970" y="137" text-anchor="middle" font-size="18" font-weight="800" fill="#eef2f8">produtos</text>
    <g font-size="15">
      <rect x="870" y="165" width="30" height="22" rx="5" fill="#f0d050" fill-opacity="0.2"/>
      <text x="885" y="181" text-anchor="middle" font-size="12" font-weight="800" fill="#f0d050">PK</text>
      <text x="908" y="182" font-weight="700" fill="#eef2f8">id</text>
      <text x="1070" y="182" text-anchor="end" fill="#9aa6ba">serial</text>
      <text x="908" y="216" fill="#eef2f8">nome</text>
      <text x="1070" y="216" text-anchor="end" fill="#9aa6ba">text</text>
      <text x="908" y="250" fill="#eef2f8">preco</text>
      <text x="1070" y="250" text-anchor="end" fill="#9aa6ba">numeric</text>
    </g>
  </g>

  <text x="550" y="378" text-anchor="middle" font-size="15" fill="#9aa6ba">
    <tspan font-weight="800" fill="#eef2f8">itens_pedido</tspan> liga pedidos e produtos: muitos para muitos (N:N)
  </text>
</svg>
