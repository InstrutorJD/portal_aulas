<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelCode</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --accent:#3aa0ff; --accent-dim:#2b6ba3; --ink:#d6e2ec; --ink-dim:#6c8698;
    --ok:#4fd67a; --err:#ff5b4d; --warn:#e0c46a;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    display:flex; flex-direction:column; overflow:hidden;
  }

  .topbar{
    min-height:42px; flex-shrink:0; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 14px; flex-wrap:wrap;
  }
  .topbar .brand{ font-weight:800; letter-spacing:1px; color:var(--accent); font-size:14px; }
  .topbar .brand small{ color:var(--ink-dim); font-weight:500; margin-left:8px; font-size:11px; }
  .topbar .actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    background:var(--accent); color:#04150c; border:none; padding:8px 14px; cursor:pointer; border-radius:2px;
  }
  button.btn:hover{ background:#5cb3ff; }
  button.btn-secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent-dim); }
  button.btn-secondary:hover{ background:rgba(58,160,255,0.1); }

  .modo{ display:flex; border:1px solid var(--accent-dim); border-radius:2px; overflow:hidden; }
  .modo button{ font-family:inherit; font-size:11px; font-weight:700; padding:7px 12px; border:none; cursor:pointer; background:transparent; color:var(--ink-dim); }
  .modo button.ativo{ background:var(--accent); color:#04150c; }
  .auto{ font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .auto input{ accent-color:var(--accent); }

  .workspace{ flex:1; min-height:0; display:flex; }
  .editor-pane{ flex:1 1 55%; min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; }
  .abas{ height:32px; flex-shrink:0; display:flex; background:var(--panel2); border-bottom:1px solid var(--line); }
  .abas button{ font-family:inherit; font-size:11px; font-weight:800; letter-spacing:1px; padding:0 16px; border:none; border-right:1px solid var(--line); cursor:pointer; background:transparent; color:var(--ink-dim); }
  .abas button.ativa{ background:var(--bg); color:var(--accent); box-shadow:inset 0 2px 0 var(--accent); }
  .abas[hidden]{ display:none; }
  #editor{ flex:1; min-height:0; overflow:hidden; }

  .lado{ flex:1 1 45%; min-width:280px; min-height:0; overflow:hidden; display:flex; flex-direction:column; border-left:1px solid var(--line); }
  .navegador{ flex:1 1 65%; min-height:0; display:flex; flex-direction:column; background:var(--panel); }
  .navegador[hidden]{ display:none; }
  .nav-barra{ height:34px; flex-shrink:0; display:flex; align-items:center; gap:6px; padding:0 8px; border-bottom:1px solid var(--line); background:var(--panel2); }
  .nav-barra button{ font-family:inherit; font-size:12px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:4px; padding:3px 8px; cursor:pointer; }
  .nav-barra button:hover{ border-color:var(--accent); color:var(--accent); }
  .nav-url{ flex:1; font-size:11px; color:var(--ink-dim); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:4px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #preview{ flex:1; min-height:0; width:100%; border:0; background:#fff; }
  #runner{ display:none; }

  .console-pane{ flex:0 0 35%; min-height:90px; display:flex; flex-direction:column; background:var(--panel); border-top:1px solid var(--line); }
  .lado.so-js .console-pane{ flex:1 1 100%; border-top:none; }
  .console-header{
    height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 12px; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px;
    border-bottom:1px solid var(--line);
  }
  .console-header button{
    background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:11px;
    font-family:inherit; text-transform:uppercase; letter-spacing:0.5px;
  }
  .console-header button:hover{ color:var(--accent); }

  .console-body{ flex:1; overflow-y:auto; padding:10px 12px; font-size:12px; line-height:1.6; }
  .console-body .line{ white-space:pre-wrap; word-break:break-word; margin-bottom:4px; padding-bottom:4px; border-bottom:1px dashed rgba(255,255,255,0.05); }
  .console-body .line.log{ color:var(--ink); }
  .console-body .line.warn{ color:var(--warn); }
  .console-body .line.error{ color:var(--err); }
  .console-body .line.info{ color:var(--ink-dim); font-style:italic; }
  .console-body .empty{ color:var(--ink-dim); font-style:italic; }

  @media (max-width: 800px) {
    .workspace{ flex-direction:column; }
    .editor-pane{ flex:1 1 50%; }
    .lado{ min-width:0; border-left:none; border-top:1px solid var(--line); flex:1 1 50%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">PixelCode <small id="subtitulo">editor + navegador</small></div>
  <div class="actions">
    <div class="modo" role="tablist" aria-label="Modo do editor">
      <button type="button" data-modo="web" id="modoWeb">Página web</button>
      <button type="button" data-modo="js" id="modoJs">Só JavaScript</button>
    </div>
    <label class="auto" id="autoWrap" title="Atualiza o navegador sozinho, meio segundo depois de você parar de digitar"><input type="checkbox" id="chkAuto"> Atualizar sozinho</label>
    <button class="btn-secondary btn" id="btnBaixar" title="Baixar a página como index.html">⬇ Baixar</button>
    <button class="btn" id="btnRun">▶ Executar (Ctrl+Enter)</button>
  </div>
</div>

<div class="workspace">
  <div class="editor-pane">
    <div class="abas" id="abas" role="tablist" aria-label="Arquivos">
      <button type="button" data-aba="html">HTML</button>
      <button type="button" data-aba="css">CSS</button>
      <button type="button" data-aba="js">JS</button>
    </div>
    <div id="editor"></div>
  </div>
  <div class="lado" id="lado">
    <div class="navegador" id="navegador">
      <div class="nav-barra">
        <button type="button" id="btnAtualizar" title="Recarregar a página">↻</button>
        <div class="nav-url" id="navUrl">pixelcode://minha-pagina</div>
        <button type="button" id="btnNovaAba" title="Abrir a página numa aba nova, em tela cheia">⧉ Nova aba</button>
      </div>
      <iframe id="preview" title="Navegador do PixelCode" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
    </div>
    <div class="console-pane">
      <div class="console-header">
        <span>Console</span>
        <button type="button" id="btnClear">Limpar</button>
      </div>
      <div class="console-body" id="consoleBody">
        <div class="empty">Nada executado ainda. Escreva um código e clique em "Executar".</div>
      </div>
    </div>
  </div>
</div>
<iframe id="runner" title="Execução do JavaScript" sandbox="allow-scripts allow-modals"></iframe>

<script src="shared/pixelcode-docs.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
  // PixelCode — editor do portal (Monaco, só CDN). Dois modos:
  //  - "Página web": abas HTML, CSS e JS e um NAVEGADOR que mostra a página
  //    funcionando, com o console embaixo;
  //  - "Só JavaScript": o editor + console de sempre.
  // Nos dois, o código roda num <iframe sandbox> SEM allow-same-origin: ele
  // não enxerga o portal (sessão, localStorage, cookies). O console e os
  // erros chegam por postMessage. Os laços do JS ganham uma checagem de
  // tempo (como o CodePen faz) para um laço infinito não congelar a aba.
  const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs';
  const CHAVE = 'pixelcode_v2';

  // Monaco usa Web Workers pra recursos como diagnóstico de sintaxe. Como
  // aqui a página é servida sem bundler (só CDN), o worker é montado num
  // blob que importa o script do próprio CDN — padrão usual pra rodar o
  // Monaco "solto", sem servidor de assets dedicado.
  window.MonacoEnvironment = {
    getWorkerUrl: function () {
      return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
        `self.MonacoEnvironment = { baseUrl: '${MONACO_BASE}/../' };\n` +
        `importScripts('${MONACO_BASE}/base/worker/workerMain.js');`
      );
    }
  };

  const INICIAL = {
    html: [
      '<h1>Olá, PixelCode!</h1>',
      '<p>Você clicou <strong id="contador">0</strong> vezes.</p>',
      '<button id="botao">Clique aqui</button>',
      '',
    ].join('\n'),
    css: [
      'body {',
      '  font-family: system-ui, sans-serif;',
      '  text-align: center;',
      '  padding: 40px;',
      '}',
      '',
      'button {',
      '  font-size: 18px;',
      '  padding: 10px 20px;',
      '  cursor: pointer;',
      '}',
      '',
    ].join('\n'),
    js: [
      'let cliques = 0;',
      'const botao = document.getElementById("botao");',
      'const contador = document.getElementById("contador");',
      '',
      'botao.addEventListener("click", () => {',
      '  cliques++;',
      '  contador.textContent = cliques;',
      '  console.log("Cliques:", cliques);',
      '});',
      '',
    ].join('\n'),
    jsSolo: [
      '// Escreva JavaScript e clique em "Executar".',
      'function somar(a, b) {',
      '  return a + b;',
      '}',
      '',
      'console.log(somar(2, 3));',
      '',
    ].join('\n'),
  };

  function lerSalvo() { try { return JSON.parse(localStorage.getItem(CHAVE) || 'null') || {}; } catch (e) { return {}; } }
  const salvo = lerSalvo();
  const estado = {
    modo: salvo.modo === 'js' ? 'js' : 'web',
    aba: ['html', 'css', 'js'].includes(salvo.aba) ? salvo.aba : 'html',
    auto: salvo.auto !== false,
  };

  // ---------- Proteção contra laço infinito ----------
  // Acha cada "for (...) {", "while (...) {" e "do {" fora de strings e
  // comentários e põe, logo depois da chave, uma chamada a __pcLaco(id): se o
  // mesmo laço rodar sem parar por mais de 2 s, ela lança um erro. Laço sem
  // chaves (ex.: for (...) x++;) não é protegido.
  function protegerLacos(src) {
    let out = '', i = 0, id = 0;
    const n = src.length;
    const ident = c => /[A-Za-z0-9_$]/.test(c || '');
    while (i < n) {
      const c = src[i], d = src[i + 1];
      if (c === '/' && d === '/') { const f = src.indexOf('\n', i); const j = f < 0 ? n : f; out += src.slice(i, j); i = j; continue; }
      if (c === '/' && d === '*') { const f = src.indexOf('*/', i + 2); const j = f < 0 ? n : f + 2; out += src.slice(i, j); i = j; continue; }
      if (c === '"' || c === "'" || c === '`') {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
        out += src.slice(i, j + 1); i = j + 1; continue;
      }
      const palavra = ['for', 'while', 'do'].find(p => src.startsWith(p, i) && !ident(src[i - 1]) && !ident(src[i + p.length]));
      if (palavra) {
        let j = i + palavra.length;
        if (palavra !== 'do') {
          while (j < n && /\s/.test(src[j])) j++;
          if (src[j] !== '(') { out += src.slice(i, j); i = j; continue; }
          let nivel = 0;
          for (; j < n; j++) { if (src[j] === '(') nivel++; else if (src[j] === ')') { nivel--; if (nivel === 0) { j++; break; } } }
        }
        let k = j;
        while (k < n && /\s/.test(src[k])) k++;
        if (src[k] === '{') { out += src.slice(i, k + 1) + `__pcLaco(${id++});`; i = k + 1; continue; }
        out += src.slice(i, j); i = j; continue;
      }
      out += c; i++;
    }
    return out;
  }

  // Script injetado no <iframe>: redireciona console/erros para o PixelCode.
  const PONTE = `<script>(function(){
    var P = parent, inicio = {}, ultimo = {};
    function fmt(a){ if (typeof a === 'string') return a; if (a instanceof Error) return a.name + ': ' + a.message;
      if (a && a.nodeType === 1) return a.outerHTML.slice(0, 300);
      try { var s = JSON.stringify(a, null, 2); return s === undefined ? String(a) : s; } catch (e) { return String(a); } }
    function envia(tipo, args){ try { P.postMessage({ pixelcode: true, tipo: tipo, texto: Array.prototype.map.call(args, fmt).join(' ') }, '*'); } catch (e) {} }
    ['log','info','warn','error'].forEach(function(t){ console[t] = function(){ envia(t, arguments); }; });
    window.__pcLaco = function(id){ var t = Date.now();
      if (!inicio[id] || t - ultimo[id] > 200) { inicio[id] = t; ultimo[id] = t; return; }
      ultimo[id] = t;
      if (t - inicio[id] > 2000) { inicio[id] = 0; throw new RangeError('Laço infinito? Um laço rodou por mais de 2 segundos e foi interrompido.'); } };
    window.addEventListener('error', function(e){ P.postMessage({ pixelcode: true, tipo: 'erro', texto: e.message, linha: e.lineno || 0 }, '*'); });
    window.addEventListener('unhandledrejection', function(e){ P.postMessage({ pixelcode: true, tipo: 'erro', texto: 'Promise rejeitada: ' + fmt(e.reason), linha: 0 }, '*'); });
  })();<\/script>`;

  // Monta o documento. Devolve também a linha em que o JS começa, para
  // traduzir o número da linha dos erros para a linha da aba JS.
  const fecharScript = s => s.replace(/<\/script/gi, '<\\/script');
  function montarDocumento(html, css, js, comPonte) {
    const cabeca = `<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n${comPonte ? PONTE + '\n' : ''}<style>\n${css}\n</style>\n</head>\n<body>\n${html}\n<script>\n`;
    return { doc: `${cabeca}${fecharScript(comPonte ? protegerLacos(js) : js)}\n<\/script>\n</body>\n</html>\n`, linhaJs: cabeca.split('\n').length };
  }

  require.config({ paths: { vs: MONACO_BASE } });

  require(['vs/editor/editor.main'], function () {
    const modelos = {
      html: monaco.editor.createModel(salvo.html != null ? salvo.html : INICIAL.html, 'html'),
      css: monaco.editor.createModel(salvo.css != null ? salvo.css : INICIAL.css, 'css'),
      js: monaco.editor.createModel(salvo.js != null ? salvo.js : INICIAL.js, 'javascript'),
      jsSolo: monaco.editor.createModel(salvo.jsSolo != null ? salvo.jsSolo : INICIAL.jsSolo, 'javascript'),
    };
    const vistas = {};
    // Documentação em português ao passar o mouse (shared/pixelcode-docs.js).
    // Registrada DEPOIS dos provedores do Monaco (que só entram quando cada
    // linguagem termina de carregar), para aparecer em cima da explicação em
    // inglês: espera o worker de JavaScript ficar pronto e dá uma folga para
    // HTML e CSS.
    if (window.PixelCodeDocs) {
      const js = monaco.languages.typescript && monaco.languages.typescript.getJavaScriptWorker
        ? monaco.languages.typescript.getJavaScriptWorker().catch(() => null) : Promise.resolve();
      Promise.all([js, new Promise(r => setTimeout(r, 1500))]).then(() => window.PixelCodeDocs.registrar(monaco));
    }
    const editor = monaco.editor.create(document.getElementById('editor'), {
      model: modelos.html,
      theme: 'vs-dark',
      fontFamily: "'JetBrains Mono', monospace",
      fontSize: 13,
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
      tabSize: 2,
    });

    const consoleBody = document.getElementById('consoleBody');
    const preview = document.getElementById('preview');
    const runner = document.getElementById('runner');
    let linhaJs = 0, timerAuto = 0, timerSalvar = 0;
    // O contentWindow de um <iframe> continua o mesmo entre recarregamentos:
    // só aceita mensagens do quadro do modo ativo.
    const quadroAtivo = () => (estado.modo === 'web' ? preview : runner).contentWindow;

    function salvar() {
      clearTimeout(timerSalvar);
      timerSalvar = setTimeout(() => {
        try {
          localStorage.setItem(CHAVE, JSON.stringify({
            modo: estado.modo, aba: estado.aba, auto: estado.auto,
            html: modelos.html.getValue(), css: modelos.css.getValue(), js: modelos.js.getValue(), jsSolo: modelos.jsSolo.getValue(),
          }));
        } catch (e) {}
      }, 400);
    }

    function logLine(text, type) {
      const empty = consoleBody.querySelector('.empty');
      if (empty) empty.remove();
      const line = document.createElement('div');
      line.className = 'line ' + (type || 'log');
      line.textContent = text;
      consoleBody.appendChild(line);
      consoleBody.scrollTop = consoleBody.scrollHeight;
    }
    function clearConsole() {
      consoleBody.innerHTML = '<div class="empty">Nada executado ainda. Escreva um código e clique em "Executar".</div>';
    }

    // Mensagens do <iframe> (só aceita as do quadro que está rodando agora).
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (!d || !d.pixelcode || ev.source !== quadroAtivo()) return;
      if (d.tipo === 'erro') {
        const l = d.linha ? d.linha - linhaJs + 1 : 0;
        const onde = l > 0 ? ` (${estado.modo === 'web' ? 'JS, ' : ''}linha ${l})` : (d.linha ? ' (num script do HTML)' : '');
        logLine(`${d.texto}${onde}`, 'error');
      } else {
        logLine(d.texto, d.tipo === 'warn' ? 'warn' : d.tipo === 'error' ? 'error' : d.tipo === 'info' ? 'info' : 'log');
      }
    });

    function executar() {
      clearConsole();
      consoleBody.innerHTML = '';
      if (estado.modo === 'web') {
        const m = montarDocumento(modelos.html.getValue(), modelos.css.getValue(), modelos.js.getValue(), true);
        linhaJs = m.linhaJs;
        preview.srcdoc = m.doc;
      } else {
        const m = montarDocumento('', '', modelos.jsSolo.getValue(), true);
        linhaJs = m.linhaJs;
        runner.onload = () => setTimeout(() => {
          if (!consoleBody.children.length) logLine('Código executado sem erros — nada foi exibido (use console.log(...)).', 'info');
        }, 80);
        runner.srcdoc = m.doc;
      }
    }

    function trocarAba(aba) {
      if (estado.modo !== 'web') return;
      vistas[estado.aba] = editor.saveViewState();
      estado.aba = aba;
      editor.setModel(modelos[aba]);
      if (vistas[aba]) editor.restoreViewState(vistas[aba]);
      document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('ativa', b.dataset.aba === aba));
      editor.focus();
      salvar();
    }

    function trocarModo(modo) {
      const chaveAtual = estado.modo === 'web' ? estado.aba : 'jsSolo';
      vistas[chaveAtual] = editor.saveViewState();
      estado.modo = modo;
      document.getElementById('modoWeb').classList.toggle('ativo', modo === 'web');
      document.getElementById('modoJs').classList.toggle('ativo', modo === 'js');
      document.getElementById('abas').hidden = modo !== 'web';
      document.getElementById('navegador').hidden = modo !== 'web';
      document.getElementById('autoWrap').style.display = modo === 'web' ? '' : 'none';
      document.getElementById('lado').classList.toggle('so-js', modo !== 'web');
      document.getElementById('subtitulo').textContent = modo === 'web' ? 'editor + navegador (HTML, CSS e JS)' : 'editor + console de JavaScript';
      const chave = modo === 'web' ? estado.aba : 'jsSolo';
      editor.setModel(modelos[chave]);
      if (vistas[chave]) editor.restoreViewState(vistas[chave]);
      document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('ativa', b.dataset.aba === estado.aba));
      salvar();
      if (modo === 'web') executar(); else clearConsole();
    }

    function baixar() {
      const doc = estado.modo === 'web'
        ? montarDocumento(modelos.html.getValue(), modelos.css.getValue(), modelos.js.getValue(), false).doc
        : modelos.jsSolo.getValue();
      const blob = new Blob([doc], { type: estado.modo === 'web' ? 'text/html' : 'text/javascript' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = estado.modo === 'web' ? 'index.html' : 'script.js';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }

    // Nova aba: a página continua dentro de um <iframe sandbox>, em tela
    // cheia — assim ela também não enxerga o portal.
    function novaAba() {
      const m = montarDocumento(modelos.html.getValue(), modelos.css.getValue(), modelos.js.getValue(), true);
      const w = window.open('', '_blank');
      if (!w) { logLine('O navegador bloqueou a nova aba. Permita pop-ups para este site.', 'warn'); return; }
      const attr = m.doc.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>PixelCode — minha página</title><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe sandbox="allow-scripts allow-modals allow-forms allow-popups" srcdoc="${attr}"></iframe></body></html>`);
      w.document.close();
    }

    editor.onDidChangeModelContent(() => {
      salvar();
      if (estado.modo === 'web' && estado.auto) { clearTimeout(timerAuto); timerAuto = setTimeout(executar, 600); }
    });
    document.querySelectorAll('#abas button').forEach(b => b.addEventListener('click', () => trocarAba(b.dataset.aba)));
    document.querySelectorAll('.modo button').forEach(b => b.addEventListener('click', () => trocarModo(b.dataset.modo)));
    const chkAuto = document.getElementById('chkAuto');
    chkAuto.checked = estado.auto;
    chkAuto.addEventListener('change', () => { estado.auto = chkAuto.checked; salvar(); });
    document.getElementById('btnRun').addEventListener('click', executar);
    document.getElementById('btnAtualizar').addEventListener('click', executar);
    document.getElementById('btnNovaAba').addEventListener('click', novaAba);
    document.getElementById('btnBaixar').addEventListener('click', baixar);
    document.getElementById('btnClear').addEventListener('click', clearConsole);
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, executar);

    trocarModo(estado.modo);
