<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto de Virada — Portal de Aulas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

  :root{
    --desk:#1c150e; --paper:#d9c9a0; --paper-edge:#b5a172; --paper-shadow:#8a7648;
    --ink:#2b2418; --ink-dim:#6b5c3c; --stamp:#b5451f; --stamp-dim:#8a3417;
    --line-dashed:#9c8a5e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:24px 14px; background:var(--desk); color:var(--ink);
    font-family:'Special Elite', 'Courier New', monospace; min-height:100vh;
  }
  .env{
    max-width:760px; margin:0 auto; background:var(--paper); position:relative;
    box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px var(--paper-edge);
    min-height:calc(100vh - 48px); display:flex; flex-direction:column;
  }
  .folder-tab{
    position:absolute; top:0; left:28px; transform:translateY(-100%);
    background:var(--stamp); color:var(--paper);
    font-family:'Courier Prime', monospace; font-weight:700; font-size:12px; letter-spacing:1.5px;
    padding:6px 18px 5px; border-radius:5px 5px 0 0;
  }
  .folio-bar{
    padding:22px 30px 6px; display:flex; justify-content:flex-end; flex-shrink:0;
    font-size:10.5px; letter-spacing:1.5px; color:var(--ink-dim); text-transform:uppercase;
  }
  .stage{ flex:1; padding:10px 30px 30px; display:flex; flex-direction:column; gap:18px; }

  /* ---- Fase 1: cena (foto + relatório) ---- */
  .dossie-row{ display:flex; align-items:flex-start; gap:20px; }
  .photo{
    flex-shrink:0; width:78px; height:96px; position:relative;
    background:linear-gradient(160deg,#8a6a4a,#4a3826); box-shadow:1px 1px 3px rgba(0,0,0,.35);
    border:3px solid #f4e9d2;
  }
  .photo::after{
    content:''; position:absolute; inset:16px 12px 0; border-radius:50% 50% 46% 46%; background:#d8bd8f;
  }
  .photo .clip{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-4deg);
    width:26px; height:14px; border:2px solid #7a7268; border-bottom:none; border-radius:3px 3px 0 0;
  }
  .report{ flex:1; min-width:0; }
  .report p{ font-size:14px; line-height:1.8; margin:0 0 12px; }
  .report p:last-child{ margin-bottom:0; }
  .report b{ color:var(--stamp); }
  .report .whisper{ display:block; margin-top:12px; font-style:italic; font-size:12.5px; color:var(--ink-dim); }

  h1.gametitle{ font-family:'Courier Prime', monospace; font-weight:700; font-size:32px; color:var(--stamp); margin:0 0 6px; letter-spacing:1px; }
  h2.prompt{ font-family:'Courier Prime', monospace; font-weight:700; font-size:16px; color:var(--ink); margin:0 0 4px; }

  /* ---- Fase 2: formulário de decisão (checklist) ---- */
  .form-hint{ font-size:10.5px; letter-spacing:1.5px; color:var(--ink-dim); text-transform:uppercase; margin-bottom:2px; }
  .options{ display:flex; flex-direction:column; }
  .option-btn{
    display:flex; align-items:flex-start; gap:12px; text-align:left; cursor:pointer;
    background:transparent; border:none; border-top:1px dashed var(--line-dashed);
    padding:13px 2px; font-size:13.5px; color:var(--ink); font-family:inherit; line-height:1.55;
  }
  .options .option-btn:last-child{ border-bottom:1px dashed var(--line-dashed); }
  .option-btn:hover{ background:rgba(181,69,31,0.06); }
  .option-btn:hover .box{ border-color:var(--stamp); }
  .option-btn .box{
    flex-shrink:0; width:15px; height:15px; border:2px solid var(--ink); margin-top:2px;
  }
  .option-btn.chosen{ opacity:1 !important; background:rgba(181,69,31,0.08); }
  .option-btn.chosen .box{ background:var(--stamp); border-color:var(--stamp); }
  .option-btn .letter{ font-family:'Courier Prime', monospace; font-weight:700; color:var(--stamp); margin-right:2px; }

  .parecer{
    border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); padding:12px 2px;
    font-size:12.5px; line-height:1.65; color:var(--ink-dim);
  }
  .parecer .label{
    display:block; font-family:'Courier Prime', monospace; font-weight:700; font-size:10.5px;
    letter-spacing:1.5px; color:var(--stamp); margin-bottom:5px;
  }

  .actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:auto; padding-top:6px; }
  button.btn{
    font-family:'Courier Prime', monospace; font-weight:700; font-size:12px; letter-spacing:1.5px;
    text-transform:uppercase; background:transparent; color:var(--stamp); border:2px solid var(--stamp);
    padding:10px 20px; cursor:pointer; transition:transform .12s ease;
  }
  button.btn:hover{ transform:rotate(-1deg) scale(1.03); background:rgba(181,69,31,.08); }
  button.btn-secondary{ color:var(--ink-dim); border-color:var(--ink-dim); }

  .ending-card{ text-align:center; position:relative; }
  .ending-card .trophy{ display:none; }
  .ending-card h2{
    font-family:'Courier Prime', monospace; font-weight:700; font-size:26px; color:var(--stamp);
    border:3px solid var(--stamp); display:inline-block; padding:6px 18px; margin:4px 0 16px;
    transform:rotate(-2deg); letter-spacing:1px;
  }
  .ending-card p{ font-size:13.5px; line-height:1.75; color:var(--ink); text-align:left; }

  .summary-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px; }
  .summary-table th, .summary-table td{ border:1px solid var(--ink-dim); padding:7px 10px; text-align:left; }
  .summary-table th{ color:var(--ink-dim); text-transform:uppercase; font-size:10.5px; letter-spacing:1px; }

  .start-screen{ text-align:center; }
  .start-screen p{ font-size:13.5px; color:var(--ink-dim); line-height:1.75; max-width:56ch; margin:0 auto 18px; }

  @media (max-width: 640px) {
    .env{ margin:0; min-height:100vh; }
    .stage{ padding:8px 18px 22px; }
    .folio-bar{ padding:26px 18px 6px; }
    .dossie-row{ flex-direction:column; }
    .photo{ width:64px; height:78px; }
  }
</style>
</head>
<body>

<div class="env">
  <div class="folder-tab">PONTO DE VIRADA</div>
  <div class="folio-bar" id="lblChapter">—</div>
  <div class="stage" id="stage"></div>
</div>

<script>
(function () {
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const STORAGE_KEY = `ponto_de_virada_state_${username}`;

  const stage = document.getElementById('stage');
  const lblChapter = document.getElementById('lblChapter');

  // ---------------------------------------------------------------
  // Estado do jogo — tudo local (localStorage), sem nenhuma chamada
  // ao Supabase: este jogo é experimental e deve poder ser removido
  // sem deixar rastro em nenhuma tabela do banco.
  // ---------------------------------------------------------------
  function freshState() {
    return {
      stepIndex: 0,
      tags: [],
      scores: { planejamento: 0, relacoes: 0, critico: 0, responsabilidade: 0 },
      analiticaChapterUsed: {},
      finished: false,
      endingId: null
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      parsed.tags = new Set(parsed.tags || []);
      return parsed;
    } catch (e) { return null; }
  }

  function saveState(state) {
    const toSave = Object.assign({}, state, { tags: [...state.tags] });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }

  let state = null;

  function hasTag(t) { return state.tags.has(t); }
  function addTag(t) { if (t) state.tags.add(t); }

  // Bônus/penalidades genéricos: qualquer decisão A/B/C gera uma tag de
  // estratégia (impulsiva/conservadora/analítica) — regra fixa do
  // blueprint (Correção 3.1). Duas consequências automáticas:
  //  - nas 3 decisões financeiras (D5, D10, D18 — ver nota abaixo),
  //    analítica soma e impulsiva tira ponto de Planejamento;
  //  - a PRIMEIRA escolha analítica de cada capítulo soma Pensamento
  //    Crítico (no máximo uma vez por capítulo, teto de 5 no total).
  // NOTA: o blueprint original (seção 3.2) cita "D5, D10, D22" para o
  // bônus financeiro, mas D22 é o Cofre 2 (matriz da Correção 4), uma
  // decisão sem opções A/B/C — não financeira. Tratamos isso como um
  // typo de transcrição do próprio blueprint e usamos D18 ("Vender
  // algo", Cap. 3, dimensão Planejamento) no lugar, por ser a única
  // outra decisão financeira com estrutura A/B/C ainda não usada nessa
  // regra. Sinalizado ao professor para confirmar.
  const FINANCIAL_IDS = [5, 10, 18];

  function applyStrategy(decisionId, chapter, strategy) {
    if (strategy === 'analitica') {
      if (FINANCIAL_IDS.includes(decisionId)) state.scores.planejamento += 1;
      if (!state.analiticaChapterUsed[chapter]) {
        state.scores.critico += 1;
        state.analiticaChapterUsed[chapter] = true;
      }
    }
    if (strategy === 'impulsiva' && FINANCIAL_IDS.includes(decisionId)) {
      state.scores.planejamento -= 1;
    }
  }

  // ---------------------------------------------------------------
  // As 28 decisões (D1–D28), em 5 capítulos — estrutura, tags e
  // dimensões seguem a Matriz da Correção 4 do blueprint. O texto de
  // cada cena (história, falas, opções) foi escrito a partir dos
  // rótulos da matriz — não existia texto pronto em nenhum documento.
  // Convenção fixa de narração (Correção 5): Lucas é sempre tratado na
  // 3ª pessoa, nunca "você"/"sua família" — o jogador decide POR ele,
  // observando de fora.
  // ---------------------------------------------------------------
  const CHAPTERS = {
    1: 'Capítulo 1 — Rotina',
    2: 'Capítulo 2 — Pressão',
    3: 'Capítulo 3 — Rachaduras',
    4: 'Capítulo 4 — Consequências',
    5: 'Capítulo 5 — Ponto de Virada'
  };

  const DECISIONS = [
    // ---------------- CAPÍTULO 1 ----------------
    {
      id: 1, chapter: 1, type: 'choice',
      story: () => `<p>Lucas está no último ano do curso técnico. Toda semana é o mesmo malabarismo: aula, estudo, ajudar em casa, e o pouco tempo que sobra pra respirar.</p><p>É segunda-feira de manhã. Como Lucas organiza a semana que começa?</p>`,
      prompt: 'Como Lucas encara a rotina dessa semana?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Não planeja nada — vai decidindo hora a hora, conforme o dia permitir.', tag: null, reaction: 'A semana começa sem rumo. Lucas até dá conta das coisas mais urgentes, mas vive correndo atrás do prejuízo.' },
        { letter: 'B', strategy: 'conservadora', text: 'Monta um horário fixo, rígido, e segue à risca — sem abrir exceção pra nada.', tag: null, reaction: 'A rotina rígida ajuda a não perder o fio, mas qualquer imprevisto (uma prova extra, um pedido de ajuda) já derruba o plano inteiro.' },
        { letter: 'C', strategy: 'analitica', text: 'Planeja a semana com prioridades claras, mas deixa espaço pra imprevisto.', tag: 'priorizou_rotina', reaction: 'O plano de Lucas sobrevive ao primeiro imprevisto sem desmoronar — ele sabe o que é essencial e o que pode esperar.' }
      ]
    },
    {
      id: 2, chapter: 1, type: 'choice',
      story: () => `<p>No intervalo, Duda — colega de turma, sempre no mesmo ritmo de Lucas nos trabalhos em grupo — se aproxima travada num exercício que precisa entregar em uma hora.</p><p>Lucas também está atrasado com o próprio material.</p>`,
      prompt: 'O que Lucas faz com o pedido de ajuda de Duda?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Diz que não tem tempo agora e volta pro próprio material.', tag: null, reaction: 'Duda entrega o exercício sozinha, do jeito que dá. Lucas ganha o próprio tempo de volta.' },
        { letter: 'B', strategy: 'conservadora', text: 'Dá uma força rápida, só o mínimo, sem se desviar muito do que estava fazendo.', tag: null, reaction: 'A ajuda de Lucas resolve uma dúvida pontual, mas Duda ainda fica boa parte do tempo por conta própria.' },
        { letter: 'C', strategy: 'analitica', text: 'Para o que está fazendo e ajuda Duda a entender de verdade, mesmo perdendo um tempo precioso.', tag: 'ajudou_colega', reaction: 'Duda termina o exercício bem mais tranquila. Lucas perde um tempo que não tinha sobrando — mas ganha uma dívida de gratidão que, mais pra frente, pode pesar a favor dele.' }
      ]
    },
    {
      id: 3, chapter: 1, type: 'choice',
      story: () => `<p>A prova de uma disciplina importante volta com uma nota bem abaixo do que Lucas esperava. Ninguém em casa sabe ainda.</p>`,
      prompt: 'O que Lucas faz com a prova?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Esconde a prova no fundo da mochila, torcendo pra ninguém perguntar.', tag: 'escondeu_nota', reaction: 'A prova some no fundo da mochila. O alívio dura só até o boletim sair.' },
        { letter: 'B', strategy: 'conservadora', text: 'Não fala nada, mas também não esconde de propósito — só evita o assunto.', tag: null, reaction: 'Lucas não mente, mas também não conta. O assunto fica pairando, sem resolução.' },
        { letter: 'C', strategy: 'analitica', text: 'Mostra a nota em casa e já chega com um plano de como vai recuperar.', tag: 'assumiu_responsabilidade', reaction: 'Não é uma conversa fácil, mas Lucas sai dela com um plano combinado — e sem nada pesando escondido.' }
      ]
    },
    {
      id: 4, chapter: 1, type: 'choice',
      story: () => `<p>Um conhecido do bairro comenta de um "bico" rápido: testar fases de um joguinho indie por umas horas na semana, pago por tarefa. Dinheiro de verdade, mas tempo que sairia do estudo.</p>`,
      prompt: 'Lucas topa o bico?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Topa na hora, animado com o dinheiro, sem calcular direito quantas horas isso vai tomar.', tag: 'comecou_bico', reaction: 'O primeiro pagamento cai na conta rápido. Só depois Lucas percebe o tanto de hora de sono que isso custou.' },
        { letter: 'B', strategy: 'conservadora', text: 'Recusa — prefere focar só nos estudos por enquanto.', tag: null, reaction: 'Lucas mantém a rotina como estava, sem o dinheiro extra, mas também sem a pressão de mais um compromisso.' },
        { letter: 'C', strategy: 'analitica', text: 'Aceita, mas negocia um número fixo de horas por semana que não invade o período de estudo.', tag: 'comecou_bico', reaction: 'O acordo é justo dos dois lados — Lucas ganha o dinheiro extra sem abrir mão do que já tinha planejado.' }
      ]
    },
    {
      id: 5, chapter: 1, type: 'choice',
      story: () => `<p>${sceneComecouBico()} chega o primeiro dinheiro de verdade que Lucas ganhou por conta própria.</p>`,
      prompt: 'O que Lucas faz com esse dinheiro?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Gasta rápido em algo que queria há tempos, sem pensar muito.', tag: null, reaction: 'O dinheiro dura pouco. A sensação boa também.' },
        { letter: 'B', strategy: 'conservadora', text: 'Guarda tudo, sem gastar nada, nem o pouco que faria diferença agora.', tag: 'guardou_dinheiro', reaction: 'O valor guardado cresce devagar — Lucas não toca nele por nada.' },
        { letter: 'C', strategy: 'analitica', text: 'Guarda a maior parte como reserva e separa um pouco, de forma consciente, pra algo que realmente importa.', tag: 'guardou_dinheiro', reaction: 'Lucas sente que tem controle sobre o próprio dinheiro pela primeira vez — sabe exatamente pra onde cada parte foi.' }
      ]
    },
    {
      id: 6, chapter: 1, type: 'choice',
      story: () => `<p>Na oficina de projetos da escola, um profissional convidado — todo mundo só chama de <b>"o Mentor"</b> — se interessa pelo projeto de Lucas e oferece orientação informal, fora do horário de aula.</p>`,
      prompt: 'Como Lucas recebe essa aproximação do Mentor?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Confia de cara, animado com a atenção, e passa a seguir tudo que o Mentor sugere.', tag: 'confiou_mentor_cedo', reaction: 'A orientação parece ótima no começo. Lucas nem para pra pensar em quem, de fato, é essa pessoa.' },
        { letter: 'B', strategy: 'conservadora', text: 'Aceita a ajuda, mas mantém distância — nada de levar tudo ao pé da letra.', tag: null, reaction: 'Lucas escuta as sugestões do Mentor, mas segue confiando mais no próprio julgamento.' },
        { letter: 'C', strategy: 'analitica', text: 'Aceita a orientação, mas primeiro pergunta por aí quem é essa pessoa e o que ela faz.', tag: null, reaction: 'Ninguém conhece o Mentor muito bem, mas as referências que Lucas encontra são positivas — segue com um pé atrás saudável.' }
      ]
    },

    // ---------------- CAPÍTULO 2 ----------------
    {
      id: 7, chapter: 2, type: 'choice',
      story: () => `<p>Uma loja de games do bairro oferece a Lucas uma vaga de meio período — pagamento melhor que o bico, mas com horários pesados justo no período de provas.</p>`,
      prompt: 'Lucas aceita a vaga?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Aceita na hora, animado com o salário fixo.', tag: 'pegou_emprego_cedo', reaction: 'O primeiro contracheque impressiona. As primeiras semanas de sono cortado, nem tanto.' },
        { letter: 'B', strategy: 'conservadora', text: 'Recusa — prioriza terminar o ano escolar tranquilo primeiro.', tag: null, reaction: 'Lucas segue sem esse dinheiro extra, mas com a cabeça livre pra estudar.' },
        { letter: 'C', strategy: 'analitica', text: 'Aceita, mas negocia um período de experiência com horário reduzido antes de assumir tudo.', tag: 'pegou_emprego_cedo', reaction: 'O acordo dá certo — Lucas entra aos poucos, sem atropelar o resto da vida de uma vez.' }
      ]
    },
    {
      id: 8, chapter: 2, type: 'choice',
      story: () => `<p>O Mentor comenta de um curso pago, avançado, que ele mesmo indica — "praticamente obrigatório" pra quem quer se destacar na área, segundo ele.</p>`,
      prompt: 'O que Lucas faz com a indicação do curso?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Se inscreve na hora, confiando de olhos fechados na palavra do Mentor.', tag: 'fez_curso_mentor', reaction: 'A matrícula sai no mesmo dia. Lucas nem procurou saber se existiam outras opções.' },
        { letter: 'B', strategy: 'conservadora', text: 'Recusa por desconfiança, sem se aprofundar no motivo.', tag: null, reaction: 'Lucas segue sem o curso, guiado só por um "não sei, prefiro não" que nem ele sabe explicar direito.' },
        { letter: 'C', strategy: 'analitica', text: 'Pesquisa o conteúdo do curso e a reputação de quem o vende antes de decidir.', tag: 'pesquisou_curso', reaction: 'A pesquisa não encontra nada alarmante — mas Lucas decide com mais base do que só a palavra do Mentor.' }
      ]
    },
    {
      id: 9, chapter: 2, type: 'choice',
      story: () => `<p>Entre o bico, o trabalho e o curso, sobrou pouco tempo pra estudar. Numa prova importante, Lucas percebe que dá pra ver a folha do colega ao lado sem ninguém notar.</p>`,
      prompt: 'Lucas cola?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Cola, sem pensar duas vezes — o cansaço fala mais alto.', tag: 'colou_prova', reaction: 'A nota sai boa. O nó no estômago também.' },
        { letter: 'B', strategy: 'conservadora', text: 'Não cola, mas entrega a prova incompleta, sem tentar nada além do que já sabe.', tag: null, reaction: 'A nota vem baixa, mas Lucas não carrega nenhum peso extra por causa dela.' },
        { letter: 'C', strategy: 'analitica', text: 'Não cola e, no fim da prova, pede ao professor um prazo extra pra revisar um ponto que não entendeu bem.', tag: null, reaction: 'O professor aceita revisar com ele depois da aula — a nota melhora um pouco, sem atalho nenhum.' }
      ]
    },
    {
      id: 10, chapter: 2, type: 'choice',
      story: () => `<p>Entre o curso pago e menos horas de bico (por causa da prova), o orçamento de Lucas aperta. Um aplicativo de empréstimo rápido aparece como solução fácil.</p>`,
      prompt: 'Lucas pega o empréstimo?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Pega o valor máximo oferecido, sem ler os termos com atenção.', tag: 'pegou_emprestimo', reaction: 'O dinheiro cai na hora. Os juros, Lucas só vai entender direito bem mais tarde.' },
        { letter: 'B', strategy: 'conservadora', text: 'Recusa e aperta o orçamento de outro jeito, cortando gastos.', tag: null, reaction: 'É mais apertado no dia a dia, mas Lucas não fica devendo a ninguém.' },
        { letter: 'C', strategy: 'analitica', text: 'Pesquisa as condições, pega só o valor mínimo necessário e já planeja como pagar.', tag: 'pegou_emprestimo', reaction: 'O valor é pequeno e o plano de pagamento parece dar certo — se nada mais sair do controle.' }
      ]
    },
    {
      id: 11, chapter: 2, type: 'choice',
      story: () => `<p>${sceneEmprestimo()} A mãe de Lucas pergunta, de passagem, se está faltando dinheiro pra alguma coisa em casa.</p>`,
      prompt: 'O que Lucas conta pra mãe?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Diz que está tudo bem, na lata, sem pensar muito na resposta.', tag: 'mentiu_pais', reaction: 'A conversa acaba ali. Lucas sente um alívio rápido — e uma pontinha de culpa que ignora.' },
        { letter: 'B', strategy: 'conservadora', text: 'Conta uma parte, só o suficiente pra não parecer estranho, mas omite os detalhes que mais pesam.', tag: 'mentiu_pais', reaction: 'A mãe fica com uma versão incompleta da situação — tranquila demais pro tamanho real do problema.' },
        { letter: 'C', strategy: 'analitica', text: 'Conta a real, com calma, incluindo o empréstimo.', tag: 'contou_pais_emprestimo', reaction: 'A conversa é desconfortável, mas a mãe agradece por Lucas ter contado antes de virar bola de neve.' }
      ]
    },
    {
      id: 12, chapter: 2, type: 'choice',
      story: () => `<p>Um sábado importante da escola (apresentação de projeto) cai no mesmo horário de um turno extra no trabalho que o chefe pediu de última hora.</p>`,
      prompt: 'Como Lucas resolve esse conflito de agenda?',
      options: [
        { letter: 'A', strategy: 'impulsiva', text: 'Falta à escola pro trabalho, sem avisar ninguém com antecedência.', tag: null, reaction: 'O chefe fica satisfeito. A escola, nem tanto — a falta pega mal na hora errada.' },
        { letter: 'B', strategy: 'conservadora', text: 'Falta ao trabalho e vai à escola, sem tentar negociar nada com o chefe.', tag: null, reaction: 'O projeto sai bem. No trabalho, Lucas perde um pouco de credibilidade por sumir sem aviso.' },

  // ---------------------------------------------------------------
  // Fórmula de fechamento (Correção 3.2 a 3.5 do blueprint) — calculada
  // uma única vez, depois da Decisão 27, lendo o conjunto final de tags.
  // Os bônus/penalidades de estratégia (analítica/impulsiva) já foram
  // somados em tempo real, em applyStrategy(), durante o jogo.
  // ---------------------------------------------------------------
  function finalizeScores() {
    if (hasTag('ajudou_colega')) state.scores.relacoes += 1;
    if (hasTag('pediu_ajuda_duda')) state.scores.relacoes += 1;
    if (hasTag('aceitou_ajuda_final')) state.scores.relacoes += 1;
    if (hasTag('recusou_ajuda_d17') && hasTag('recusou_ajuda_d27')) state.scores.relacoes -= 1;

    if (hasTag('confrontou_mentor')) state.scores.critico += 1;
    if (hasTag('confiou_mentor_cedo') && !hasTag('pesquisou_curso')) state.scores.critico -= 1;

    if (hasTag('assumiu_responsabilidade')) state.scores.responsabilidade += 1;
    if (hasTag('contou_pais_emprestimo')) state.scores.responsabilidade += 1;
    if (hasTag('pediu_desculpa')) state.scores.responsabilidade += 1;
    if (hasTag('escondeu_nota')) state.scores.responsabilidade -= 1;
    if (hasTag('mentiu_pais')) state.scores.responsabilidade -= 1;
    if (hasTag('colou_descoberto')) state.scores.responsabilidade -= 1;

    if (hasTag('guardou_dinheiro')) state.scores.planejamento += 1;
    if (hasTag('pegou_emprestimo') && !hasTag('passou_cofre1')) state.scores.planejamento -= 1;
  }

  function faixa(v) { return v <= 0 ? 'baixo' : (v <= 2 ? 'medio' : 'alto'); }

  const ENDINGS = {

  function resolveEnding() {
    finalizeScores();

    // Overrides (checados antes de qualquer tabela — Correção 3.4).
    const dividaNaoResolvida = !(hasTag('aceitou_ajuda_final'));
    if (hasTag('revelacao_cofre') && dividaNaoResolvida) return 9;
    if (hasTag('colou_descoberto') && hasTag('mentiu_pais')) return 10;

    const s = state.scores;
    const dims = [
      { key: 'planejamento', v: s.planejamento },
      { key: 'relacoes', v: s.relacoes },
      { key: 'critico', v: s.critico },
      { key: 'responsabilidade', v: s.responsabilidade }
    ];

    // Desempate fixo (Correção 3.5): Responsabilidade como dominante, Relações como mais fraca.
    const priorityDominant = ['responsabilidade', 'planejamento', 'critico', 'relacoes'];
    const priorityWeak = ['relacoes', 'critico', 'planejamento', 'responsabilidade'];

    let dominant = dims.slice().sort((a, b) => b.v - a.v || priorityDominant.indexOf(a.key) - priorityDominant.indexOf(b.key))[0];
    let weakest = dims.slice().sort((a, b) => a.v - b.v || priorityWeak.indexOf(a.key) - priorityWeak.indexOf(b.key))[0];

    const dominantFaixa = faixa(dominant.v);
    const weakestFaixa = faixa(weakest.v);

    if (dims.every(d => faixa(d.v) === 'medio')) return 8;
    if (dominantFaixa !== 'alto' || weakestFaixa !== 'baixo') {
      // Sem alto claro dominando e baixo claro mais fraco: cai no final neutro-padrão.
      return 8;
    }

    const TABLE = {
      planejamento: { relacoes: 2, critico: 5, responsabilidade: 6 },
      relacoes: { planejamento: 7, critico: 1, responsabilidade: 3 },
      critico: { planejamento: 5, relacoes: 8, responsabilidade: 4 },
      responsabilidade: { planejamento: 6, relacoes: 3, critico: 1 }
    };
    const row = TABLE[dominant.key];
    return (row && row[weakest.key]) || 8;
  }

  // ---------------------------------------------------------------
  // Motor de tela — story/choice, cofre (4 opções dinâmicas), twist
  // (narrativo, sem escolha) e telas de início/fim.
  // ---------------------------------------------------------------
  function folio(text) { lblChapter.textContent = text; }

  function render() {
    if (state.finished) return renderEnding();
    const node = DECISIONS[state.stepIndex];
    folio(`${CHAPTERS[node.chapter]} — Registro ${node.id}/28`);

    if (node.type === 'choice') return renderChoice(node);
    if (node.type === 'cofre') return renderCofre(node);
    if (node.type === 'twist') return renderTwist(node);
  }

  function advance() {
    state.stepIndex += 1;
    if (state.stepIndex >= DECISIONS.length) {
      state.endingId = resolveEnding();
      state.finished = true;
    }
    saveState(state);
    render();
  }

  // Fase 1 — página de relatório: foto de Lucas grampeada + o texto da
  // cena. As opções só aparecem depois que o jogador clica em
  // "Continuar", numa página separada (renderDecisionForm) — pra não
  // parecer uma atividade de múltipla escolha desde o primeiro instante.
  function renderScene(bodyHtml, onContinue, whisperHtml) {
    stage.innerHTML = `
      <div class="dossie-row">
        <div class="photo"><div class="clip"></div></div>
        <div class="report">
          ${bodyHtml}
          ${whisperHtml ? `<span class="whisper">${whisperHtml}</span>` : ''}
        </div>
      </div>
      <div class="actions"><button class="btn" id="btnNext">Próximo registro →</button></div>
    `;
    document.getElementById('btnNext').addEventListener('click', onContinue);
  }

  // Fase 2 — formulário de decisão: checklist estilo ficha, sem foto.
  function renderDecisionForm(promptText, choices, onPick) {
    stage.innerHTML = `
      <h2 class="prompt">${promptText}</h2>
      <div class="form-hint">Marcar decisão ▾</div>
      <div class="options" id="optionsWrap"></div>
    `;
    const wrap = document.getElementById('optionsWrap');
    choices.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="box"></span><span><span class="letter">${opt.letter}</span> ${opt.text}</span>`;
      btn.addEventListener('click', () => { btn.classList.add('chosen'); onPick(opt, idx); });
      wrap.appendChild(btn);
    });
  }

  function renderChoice(node) {
    renderScene(node.story(), () => renderChoiceOptions(node));
  }

  function renderChoiceOptions(node) {
    renderDecisionForm(node.prompt, node.options, (opt) => {
      addTag(opt.tag);
      applyStrategy(node.id, node.chapter, opt.strategy);
      saveState(state);
      renderReaction(opt.reaction);
    });
  }

  function renderReaction(text) {
    const card = document.createElement('div');
    card.className = 'parecer';
    card.innerHTML = `<span class="label">Parecer</span>${text}`;
    stage.appendChild(card);
    document.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.4'; b.style.cursor = 'default'; });

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.style.marginTop = '4px';
    actions.innerHTML = `<button class="btn" id="btnNext">Continuar →</button>`;
    stage.appendChild(actions);
    document.getElementById('btnNext').addEventListener('click', advance);
  }

  function renderTwist(node) {
    if (typeof node.onEnter === 'function') node.onEnter();
    saveState(state);
    renderScene(node.story(), advance, node.whisper());
  }

  function renderCofre(node) {
    renderScene(node.intro(), () => renderCofreOptions(node), `Cofre ${node.cofreNum} — uma pergunta, sem sorte envolvida.`);
  }

  function renderCofreOptions(node) {
    const correct = node.correctText();
    const allOptions = [correct, ...node.distractors];
    const order = allOptions.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const letters = ['A', 'B', 'C', 'D'];
    const choices = order.map((origIdx, pos) => ({ letter: letters[pos], text: allOptions[origIdx], origIdx }));

    renderDecisionForm(node.question, choices, (opt) => {
      const isCorrect = opt.origIdx === 0;
      if (isCorrect) addTag(node.passTag);
      saveState(state);
      renderReaction(isCorrect ? node.onCorrect : node.onWrong);
    });
  }

  function renderEnding() {
    folio('Epílogo');
    const ending = ENDINGS[state.endingId];
    stage.innerHTML = `
      <div class="ending-card">
        <h2>${ending.title}</h2>
        <p>${ending.text}</p>
      </div>
      <div class="actions"><button class="btn" id="btnNext">Continuar →</button></div>
    `;
    document.getElementById('btnNext').addEventListener('click', renderEpilogueScene);
  }

  function renderEpilogueScene() {
    const epilogo = hasTag('ajudou_colega')
      ? '<p>Dez anos depois, Lucas cruza com Duda por acaso — os dois riem lembrando dessa época, ainda próximos, mesmo com o tempo que passou.</p>'
      : '<p>Dez anos depois, Lucas não sabe mais muito bem por onde anda Duda — os caminhos, sem querer, se separaram ao longo do tempo.</p>';
    renderScene(epilogo, renderEpilogueOptions);
  }

  function renderEpilogueOptions() {
    const options = [
      { letter: 'A', text: 'Reconhece, sem culpa, que os caminhos foram esses — e que aprendeu no processo.' },
      { letter: 'B', text: 'Comenta, sem dramatizar, o que faria diferente com o que sabe hoje.' },
      { letter: 'C', text: 'As duas coisas — reconhece o caminho e também o que mudaria.' }
    ];
    renderDecisionForm('Olhando pra trás, o que Lucas pensa da própria trajetória?', options, () => {
      addTag('reconheceu_trajetoria');
      saveState(state);
      renderSummary();
    });
  }

  function renderSummary() {
    folio('Fim de jogo');
    const s = state.scores;
    stage.innerHTML = `
      <div class="report">
        <p>Essa foi a trajetória de Lucas nas mãos de quem jogou. Vale levar esse resultado pra uma roda de conversa com o professor — não existe caminho "certo" único aqui, cada dimensão conta uma parte diferente da história.</p>
        <table class="summary-table">
          <tr><th>Dimensão</th><th>Nível</th></tr>
          <tr><td>Planejamento</td><td>${faixa(s.planejamento)}</td></tr>
          <tr><td>Relações</td><td>${faixa(s.relacoes)}</td></tr>
          <tr><td>Pensamento Crítico</td><td>${faixa(s.critico)}</td></tr>
          <tr><td>Responsabilidade</td><td>${faixa(s.responsabilidade)}</td></tr>
        </table>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="btnRestart">↻ Jogar de novo</button>
      </div>
    `;
    document.getElementById('btnRestart').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      state = freshState();
      state.tags = new Set();
      renderStart();
    });
  }

  function renderStart(resuming) {
    folio('—');
    stage.innerHTML = `
      <div class="start-screen">
        <h1 class="gametitle">Ponto de Virada</h1>
        <p>Lucas está no último ano do curso técnico, tentando equilibrar estudo, dinheiro e as próprias escolhas. Cada decisão importante deste processo é sua — não de Lucas: você decide <b>por</b> ele, revisando o caso de fora.</p>
        <p>São 28 registros em 5 capítulos. Não existe resposta perfeita — só consequências diferentes, que se acumulam até o final.</p>
        <div class="actions" style="justify-content:center;">
          <button class="btn" id="btnStart">${resuming ? 'Continuar de onde parei' : 'Abrir processo'}</button>
          ${resuming ? '<button class="btn btn-secondary" id="btnFresh">Recomeçar do zero</button>' : ''}
        </div>
      </div>
    `;
    document.getElementById('btnStart').addEventListener('click', render);
    const btnFresh = document.getElementById('btnFresh');
    if (btnFresh) {
      btnFresh.addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        state = freshState();
        state.tags = new Set();
        renderStart(false);
      });
    }
  }

  // ---------------------------------------------------------------
  const existing = loadState();
  if (existing && !existing.finished) {
    state = existing;
    renderStart(true);
  } else {
    state = freshState();
    state.tags = new Set();
    renderStart(false);
  }
})();
</script>

<script src="../shared/vlibras-widget.js"></script>

</body>
